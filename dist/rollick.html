      // The direct route. If the signalling server is down we can still host over the backup route.
      let peer = null;
      try {
        peer = new Peer(PEER_PREFIX + code, peerOptions);
        await open(peer);
      } catch (e) {
        peer?.destroy();
        peer = null;
        if (e.type === 'unavailable-id') { bus?.close(); throw new Error('taken'); }
        if (!bus) throw new Error('network');
      }
      if (bus && !peer) { // hosting over the backup route alone: is another room already using this code?
        const up = await bus.ready(8000);
        if (!up) { bus.close(); throw new Error('network'); }
        if (!resume) {
          let clash = false;
          bus.subscribe(`${home}/w`, (m) => { if (m.t === 'taken') clash = true; });
          bus.publish(`${home}/g`, { t: 'whois' });
          await sleep(1200);
          if (clash) { bus.close(); throw new Error('taken'); }
        }
      }

      const subs = new Set();
      const status = statusFeed();
      const conns = new Map(); // connection -> player uid
      const reactSubs = new Set();
      /** The connections worth sending to: every open one, except a backup-route copy of a guest who is connected directly. */
      const targets = () => {
        const direct = new Set([...conns].filter(([c]) => !c.relay && c.open).map(([, u]) => u));
        const out = [];
        for (const conn of [...conns.keys()]) {
          if (conn.relay && Date.now() - conn.last > 90000) { conns.delete(conn); continue; }
          if (conn.open && !(conn.relay && direct.has(conns.get(conn)))) out.push(conn);
        }
        return out;
      };
      const broadcast = () => {
        const key = seatsKey(room);
        for (const conn of targets()) {
          // over the backup route, only resend the seats (which carry the icons) when they changed
          if (conn.relay && room.game && conn.seats === key) conn.send({ t: 'game', game: room.game, status: room.status });
          else { conn.send({ t: 'room', room }); conn.seats = key; }
        }
        subs.forEach((cb) => cb(snapshotOf(room)));
      };
      // An emoji from a seated player goes to everyone, at most one a second from each.
      const lastReact = new Map();
      const react = (uidFrom, emoji) => {
        const seat = room?.seats.findIndex((p) => p.uid === uidFrom) ?? -1;
        if (seat < 0 || !REACTIONS.includes(emoji) || Date.now() - (lastReact.get(uidFrom) || 0) < 900) return;
        lastReact.set(uidFrom, Date.now());
        for (const conn of targets()) conn.send({ t: 'react', seat, e: emoji });
        reactSubs.forEach((cb) => cb(seat, emoji));
      };
      const publish = (next) => {
        room = next;
        tryStorage(() => localStorage.setItem(keyOf(code), JSON.stringify(room)));
        broadcast();
      };

      // Guests can only ask to join the lobby, or make the move it is their turn to make.
      const onGuestMessage = (conn, msg) => {
        const sender = conns.get(conn);
        if (!room || !sender) return;
        if (room.banned?.includes(sender)) { conn.send({ t: 'bye' }); return; } // removed by the host
        if (msg.t === 'ping') { conn.send({ t: 'pong' }); return; }
        if (msg.t === 'react') { react(sender, msg.e); return; }
        if (msg.t === 'hello') { conn.send({ t: 'room', room }); conn.seats = seatsKey(room); return; }
        if (msg.t !== 'set' || !msg.room) return;
        if (room.status === 'lobby') {
          // In the lobby a guest may only add or update their own seat.
          const mine = msg.room.seats?.find((p) => p.uid === sender);
          const at = room.seats.findIndex((p) => p.uid === sender);
          if (mine && at >= 0) {
            const others = room.seats.filter((_, i) => i !== at).map((p) => p.color);
            const look = { name: cleanName(mine.name), color: freeColor(others, mine.color), avatar: safeAvatar(mine.avatar) };
            publish({ ...room, seats: room.seats.map((p, i) => (i === at ? { ...p, ...look } : p)) });
            return;
          }
          if (mine && room.seats.length < MAX_SEATS) {
            const look = { name: cleanName(mine.name), color: freeColor(room.seats.map((p) => p.color), mine.color), avatar: safeAvatar(mine.avatar) };
            publish({ ...room, seats: [...room.seats, { uid: sender, cpu: false, ...look }] });
            return;
          }
        } else if (room.game && msg.room.game) {
          const mover = room.seats[room.game.current]?.uid;
          const g = msg.room.game;
          if (mover === sender && g.gid === room.game.gid && g.rev > room.game.rev) {
            publish({ ...room, game: g, status: g.phase === 'over' ? 'over' : 'playing' });
            return;
          }

        conn.send({ t: 'room', room }); // refused: resync the sender
        conn.seats = seatsKey(room);
      };

      if (peer) {
        peer.on('connection', (conn) => {
          conns.set(conn, conn.metadata?.uid ?? null);
          conn.on('data', (msg) => onGuestMessage(conn, msg));
          conn.on('close', () => conns.delete(conn));

      }

      // Guests on the backup route: each one has its own reply topic, and says who they are in every message.
      const relayConns = new Map(); // uid -> pseudo connection
      if (bus) {
        bus.subscribe(`${home}/g`, (msg) => {
          if (msg.t === 'whois') { if (room) bus.publish(`${home}/w`, { t: 'taken' }); return; }
          const from = typeof msg.uid === 'string' ? msg.uid.slice(0, 80) : '';
          if (!from) return;
          if (msg.t === 'bye') { const c = relayConns.get(from); if (c) { conns.delete(c); relayConns.delete(from); } return; }
          let conn = relayConns.get(from);
          if (!conn) {
            conn = { relay: true, open: true, last: Date.now(), seats: '', send: (m) => bus.publish(`${home}/h/${from}`, m) };
            relayConns.set(from, conn);

          onGuestMessage(conn, msg);
        });
      }

      // A locked or backgrounded phone drops its link to the signalling server; get it back.
      let regain = 0;
      const regainSignal = () => {
        if (!peer || peer.destroyed || !peer.disconnected) return;
        if (!bus?.alive) status.set('reconnecting');
        try { peer.reconnect(); } catch { /* not ready yet; the timer tries again */ }
        clearTimeout(regain);
        regain = setTimeout(regainSignal, 3000);
      };
      peer?.on('disconnected', regainSignal);
      peer?.on('open', () => { clearTimeout(regain); status.set('online'); });

      document.addEventListener('visibilitychange', onVisible);

      return {
        async get() { return snapshotOf(room); },
        async set(next) { publish(JSON.parse(JSON.stringify(next))); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next) { subs.add(next); next(snapshotOf(room)); return () => subs.delete(next); },
        onStatus: status.on,
        react: (emoji) => react(uid, emoji),
        onReact: (cb) => { reactSubs.add(cb); return () => reactSubs.delete(cb); },
        retry: regainSignal,
        close() {
          clearTimeout(regain);
          document.removeEventListener('visibilitychange', onVisible);
          for (const conn of conns.keys()) if (conn.open) conn.send({ t: 'bye' }); // so guests leave at once

    async join(code) {
      const home = `${ROOT}/${code}`;
      let bus = null; // the backup route; only opened if the direct route is slow or fails
      let peer = null;
      try { peer = new Peer(undefined, peerOptions); await open(peer); } catch { peer?.destroy(); peer = null; if (!useRelay) throw new Error('network'); }

      let room = null; // the last room we were sent; kept while reconnecting
      let fresh = true; // the next room message is the first on a new connection
      let conn = null;
      let closed = false;
      let lastSeen = Date.now();
      let relayLast = 0; // when the backup route last heard from the host
      const subs = new Set();
      const errors = new Set();
      const reactSubs = new Set();
      const status = statusFeed();
      const relayOk = () => !!bus && Date.now() - relayLast < 45000;
      let helloTimer = 0;
      let raceDone = false;
      let firstRelay = null;
      const notify = () => subs.forEach((cb) => cb(snapshotOf(room)));

      // Direct route.
      let latest = null; // the newest connection attempt; anything from an older one is ignored
      const connect = () => new Promise((resolve, reject) => {
        if (!peer) { reject(new Error('network')); return; }
        const c = peer.connect(PEER_PREFIX + code, { metadata: { uid }, reliable: true });
        latest = c;
        const timer = setTimeout(() => reject(new Error('timeout')), 15000); // slow networks can take a while
        const onPeerError = (e) => { if (e.type === 'peer-unavailable') { clearTimeout(timer); reject(new Error('notfound')); } };
        peer.on('error', onPeerError);
        c.on('open', () => c.send({ t: 'hello' }));
        c.on('data', (msg) => {
          if (c !== latest) return;
          lastSeen = Date.now();
          if (msg.t === 'bye') {
            closed = true;
            if (!room) { clearTimeout(timer); reject(new Error('removed')); return; } // turned away before we got in
            errors.forEach((cb) => cb({ code: 'closed' }));
            return;
          }
          if (msg.t === 'react') { reactSubs.forEach((cb) => cb(msg.seat, msg.e)); return; }
          if (msg.t !== 'room') return;
          clearTimeout(timer);
          peer.off('error', onPeerError);
          room = msg.room;
          if (fresh || !conn?.open) { fresh = false; conn = c; status.set('online'); resolve(); }
          notify();
        });
        c.on('close', () => { if (!closed && conn === c) reconnect(); });
      });

      // Backup route: say hello until the host answers, then keep saying it as a heartbeat.
      const hello = () => bus?.publish(`${home}/g`, { t: 'hello', uid, have: room ? hashOf(seatsKey(room)) : 0 });
      const relayFirst = () => new Promise((resolve, reject) => {
        bus = relayBus(brokers);
        let first = true;
        const timer = setTimeout(() => reject(new Error('timeout')), 8000);
        bus.subscribe(`${home}/h/${uid}`, (msg) => {
          relayLast = Date.now();
          if (msg.t === 'bye') {
            closed = true;
            if (!room) { clearTimeout(timer); reject(new Error('removed')); return; }
            errors.forEach((cb) => cb({ code: 'closed' }));
            return;
          }
          if (msg.t === 'react') { reactSubs.forEach((cb) => cb(msg.seat, msg.e)); return; }
          if (msg.t === 'room') room = msg.room;
          else if (msg.t === 'game' && room) room = { ...room, game: msg.game, status: msg.status };
          else if (msg.t === 'game') { hello(); return; } // we missed the seats: ask for everything
          else return;
          if (first) {
            first = false;
            clearTimeout(timer);
            status.set('online');
            clearInterval(helloTimer);
            helloTimer = setInterval(hello, 20000); // from now on just a heartbeat
            resolve();
          }
          notify();
        });
        bus.ready(8000).then((up) => {
          if (!up) { clearTimeout(timer); reject(new Error('network')); return; }
          hello();
          clearInterval(helloTimer);
          helloTimer = setInterval(() => { if (!relayLast) hello(); }, 2000); // until the host first answers
        });
      });

      // Keeps trying for about two minutes, since the host may only have locked their phone for a moment.
      let retrying = false;
      async function reconnect() {
        if (retrying || closed) return;
        retrying = true;
        if (useRelay) ensureRelay().catch(() => {}); // if the direct link dropped, the backup route takes over
        if (!relayOk()) status.set('reconnecting');
        for (let i = 0; i < 30 && !closed; i++) {
          await sleep(Math.min(1500 + i * 500, 5000));
          try {
            if (peer?.disconnected) peer.reconnect();
            fresh = true; // the first message after reconnecting replaces our connection
            await connect();
            retrying = false;
            return;
          } catch { /* try again */ }
          if (relayOk()) status.set('online');
        }
        retrying = false;
        if (relayOk()) return;
        status.set('lost');
        errors.forEach((cb) => cb({ code: 'lost' }));
      }

      // Open the backup route on demand, once.
      const ensureRelay = () => (useRelay ? (firstRelay ||= relayFirst()) : Promise.reject(new Error('network')));

      // Take whichever route answers first. The backup route only starts if the direct one has not connected after
      // a couple of seconds, so a normal game never touches the public servers. A wrong code is only reported once
      // the backup route has had its say.
      const direct = connect().catch(async (e) => { if (e.message === 'notfound') await sleep(3000); throw e; });
      const backup = !peer ? ensureRelay() : sleep(2000).then(() => (conn?.open ? new Promise(() => {}) : ensureRelay()));
      try {
        await Promise.any([direct, backup]);
      } catch (all) {
        const errs = all.errors || [];
        peer?.destroy();
        bus?.close();
        clearInterval(helloTimer);
        raceDone = true;
        throw errs.find((e) => e.message === 'removed') || errs.find((e) => e.message === 'notfound') || errs.find((e) => e.message === 'timeout') || errs[0] || new Error('network');
      }
      raceDone = true;
      backup.catch(() => {}); // the loser may still fail later; that is fine
      direct.catch(() => {});

      // A phone that was backgrounded can keep a dead link open; ping so it is noticed, and recheck on wake-up.
      const beat = setInterval(() => {
        if (closed || retrying || !conn) return;
        if (Date.now() - lastSeen > 25000) { conn.close(); return; }
        if (conn.open) conn.send({ t: 'ping' });
      }, 8000);
      const onVisible = () => {
        if (document.hidden || closed || retrying) return;
        if (!conn?.open || Date.now() - lastSeen > 25000) { try { conn?.close(); } catch { /* already closed */ } if (conn) reconnect(); }
        hello();
      };
      document.addEventListener('visibilitychange', onVisible);
      clearInterval(helloTimer);
      if (bus) helloTimer = setInterval(hello, 20000);

      return {
        async get() { return snapshotOf(room); },
        async set(next) {
          // A move only needs the game; everything else (seats, icons) is the host's to keep.
          const sent = next.game ? { game: next.game, status: next.status } : next;
          if (conn?.open) { conn.send({ t: 'set', room: JSON.parse(JSON.stringify(sent)) }); return; }
          if (bus?.alive) { bus.publish(`${home}/g`, { t: 'set', uid, room: JSON.parse(JSON.stringify(sent)) }); return; }
          throw new Error('offline');
        },
        async acquire() { return { acquired: true }; },
        onSnapshot(next, error) { subs.add(next); if (error) errors.add(error); next(snapshotOf(room)); return () => { subs.delete(next); errors.delete(error); }; },
        onStatus: status.on,
        async react(emoji) {
          if (conn?.open) conn.send({ t: 'react', e: emoji });
          else if (bus?.alive) bus.publish(`${home}/g`, { t: 'react', uid, e: emoji });
        },
        onReact: (cb) => { reactSubs.add(cb); return () => reactSubs.delete(cb); },
        retry: () => { try { conn?.close(); } catch { /* already closed */ } retrying = false; if (peer) reconnect(); else if (bus) hello(); },
        close() {
          closed = true;
          clearInterval(beat);
          clearInterval(helloTimer);
          document.removeEventListener('visibilitychange', onVisible);
          if (bus) bus.publish(`${home}/g`, { t: 'bye', uid });
          setTimeout(() => { peer?.destroy(); bus?.close(); }, 300);
        },
      };
    },
  };
}

/**
 * A die that is a real cube: six faces in 3D, turned so the rolled number faces you, with a slight tilt so the top and
 * side show. The faces are shaded for a light from the top left, worked out from the way this die ends up turned.
 */
const TURN = { 1: [0, 0], 2: [-90, 0], 3: [0, -90], 4: [0, 90], 5: [90, 0], 6: [0, 180] };
const NORMAL = { 1: [0, 0, 1], 6: [0, 0, -1], 3: [1, 0, 0], 4: [-1, 0, 0], 2: [0, -1, 0], 5: [0, 1, 0] };
const TILT = [-16, 20];
function shades(face) {
  const rad = (d) => (d * Math.PI) / 180;
  const rx = (v, a) => [v[0], v[1] * Math.cos(rad(a)) - v[2] * Math.sin(rad(a)), v[1] * Math.sin(rad(a)) + v[2] * Math.cos(rad(a))];
  const ry = (v, a) => [v[0] * Math.cos(rad(a)) + v[2] * Math.sin(rad(a)), v[1], -v[0] * Math.sin(rad(a)) + v[2] * Math.cos(rad(a))];
  const [ax, ay] = TURN[face];
  const light = [-0.45, -0.65, 0.62];
  const out = {};
  for (const f of [1, 2, 3, 4, 5, 6]) {
    const n = rx(ry(rx(ry(NORMAL[f], ay), ax), TILT[1]), TILT[0]); // the order the transforms stack in CSS
    const lit = n[0] * light[0] + n[1] * light[1] + n[2] * light[2];
    out[f] = Math.max(0, Math.min(1, 0.5 - lit * 0.55)).toFixed(2); // 0 = bright, 1 = dark
  }
  return out;
}
function die3d(face, cls = '', attrs = '', rollSpin = null) {
  const sh = shades(face);
  const [ax, ay] = TURN[face];
  const faces = [1, 2, 3, 4, 5, 6].map((f) => {
    const pips = Array.from({ length: 9 }, (_, i) => `<i${PIPS[f].includes(i) ? ' class="on"' : ''}></i>`).join('');
    return `<b class="cf f${f}" style="--sh:${sh[f]}">${pips}</b>`;
  }).join('');
  const spin = rollSpin ? `--rx:${rollSpin[0]}deg;--ry:${rollSpin[1]}deg;` : '';
  return `<div class="die cube3d ${cls}" data-roll="${ui.rollSeq || 0}" aria-label="${face}" ${attrs.replace('style="', `style="--ax:${ax}deg;--ay:${ay}deg;${spin}`)}><span class="cube"><span class="cube-in">${faces}</span></span></div>`;
}

  renderedModal = ui.modal;
  const after = app.querySelector('.modal .sheet');
  if (after && keep) after.scrollTop = keep;
  const cv = document.getElementById('avcv');
  if (cv && ui.ed) paintCanvas(cv, ui.ed.sk);
  positionPeek();
  watchRooms();
  syncGL();
}

/**
 * Studio-quality 3D: hand the dice on screen to the 3D engine (vendor/dice3d.js), which draws them on a canvas over the
 * page. The page's own dice stay (hidden) for taps and screen readers. Without WebGL the CSS cubes are used instead.
 */
function syncGL() {
  const root = document.documentElement;
  const engine = window.RollDice3D;
  const off = () => { root.removeAttribute('data-gl'); engine?.hide(); };
  if (!engine || glBroken || !gl.on || !cube.on || !engine.available()) { off(); return; }
  let els = [];
  let z = 5;
  if (!ui.modal && ui.screen === 'game') els = [...app.querySelectorAll('.dice .die.cube3d')];
  if (!els.length) { off(); return; }
  const num = (el, name) => parseFloat(getComputedStyle(el).getPropertyValue(name)) || 0;
  const colour = (el, name) => getComputedStyle(el).getPropertyValue(name).trim();
  const dice = els.map((el, k) => ({
    el, key: el.dataset.i !== undefined ? `r${el.dataset.i}` : `h${k}`,
    face: +el.getAttribute('aria-label') || 1,
    color: colour(el, '--c'), pip: colour(el, '--pc') || colour(el, '--pip'),
    rolling: el.classList.contains('rolling'), token: +el.dataset.roll || 0,
    delay: num(el, '--d'), dur: num(el, '--dur'), dx: num(el, '--dx'),
    dim: el.classList.contains('hand'), spin: el.classList.contains('spin'),
  }));
  const ok = engine.show({ dice, skin: theme.dice, calm: calm.on || reducedMotion(), z });
  if (ok) root.setAttribute('data-gl', '1'); else { glBroken = true; off(); }
}

function watchRooms() {
  const want = ui.screen === 'online' && net.store?.kind === 'p2p';

/** A host who made the room public keeps it on the list, as long as it is in the lobby with a free seat. */
function syncDirectory(room) {
  const open = isHost() && net.store?.kind === 'p2p' && room?.public && room.status === 'lobby' && room.seats.length < MAX_PLAYERS;
  if (open) {
    net.dir ||= lobbyAnnouncer(window.RFI_RELAY_BROKERS ?? DEFAULT_BROKERS);
    const me = room.seats.find((p) => p.uid === room.hostUid);
    net.dir.announce({ code: room.code, host: me?.name || 'Player', mode: room.mode === 'extreme' ? 'extreme' : 'classic', n: room.seats.length, max: MAX_PLAYERS });
  } else if (net.dir) {
    net.dir.withdraw();
  }
}

/** What just happened with the power cards and chaos rules, in a sentence. */
function eventsText(s) {
  const who = (p) => s.players[p].name;
  return (Array.isArray(s.events) ? s.events : []).map((e) => {
    const pw = E.POWERS[e?.kind] || { icon: '', name: 'a card' };
    if (!s.players[e?.player] && e?.type !== 'chaos') return '';
    if (e.type === 'lucky') return `${who(e.player)} rolled three of a kind and won ${pw.icon} ${pw.name}!`;
    if (e.type === 'earned') return `${who(e.player)} earned ${pw.icon} ${pw.name}.`;
    if (e.type === 'power') return `${who(e.player)} played ${pw.icon} ${pw.name}${e.target !== undefined ? ` on ${who(e.target)}` : ''}.`;
    if (e.type === 'skipped') return `${who(e.player)} misses a turn.`;
    if (e.type === 'chaos') return e.kind === 'double' ? '⚡ Double points this round!' : '⚡ Chaos! Every die goes home.';
    return '';
  }).filter(Boolean).join(' ');
}

/** The power-card sheet: your cards, and the little steps to play one. */
function powersView() {
  const s = ui.game;
  const holder = ui.online ? net.mySeat : s.current;
  if (!s || s.mode !== 'extreme' || holder < 0) return '';
  const hand = Array.isArray(s.players[holder].powers) ? s.players[holder].powers.filter((k) => E.POWERS[k]) : [];
  const myTurn = canAct() && s.phase === 'placing' && holder === s.current;
  const pw = ui.power;
  const close = '<button class="btn primary" data-act="closeModal">Close</button>';
  let body;
  if (pw && (pw.kind === 'reroll' || (pw.kind === 'set' && pw.rolled === undefined))) {
    body = `<h2>${E.POWERS[pw.kind].icon} ${E.POWERS[pw.kind].name}</h2><p>Pick a die.</p>
      <div class="pickrow">${s.rolled.map((f, i) => die(f, 'owned', `style="${diceVars(seats()[holder], holder)}" data-act="powerDie" data-i="${i}" role="button" tabindex="0"`)).join('')}</div>
      <button class="btn" data-act="powerBack">Back</button>`;
  } else if (pw?.kind === 'set') {
    body = `<h2>${E.POWERS.set.icon} ${E.POWERS.set.name}</h2><p>Turn the ${s.rolled[pw.rolled]} into…</p>
      <div class="pickrow">${[1, 2, 3, 4, 5, 6].filter((f) => f !== s.rolled[pw.rolled]).map((f) => die(f, 'owned', `style="${diceVars(seats()[holder], holder)}" data-act="powerFace" data-f="${f}" role="button" tabindex="0"`)).join('')}</div>
      <button class="btn" data-act="powerBack">Back</button>`;
  } else if (pw?.kind === 'knock') {
    const rows = [];
    s.cards.forEach((c, ci) => s.players.forEach((pl, p) => {
      if (p !== holder && c.placed[p].length) rows.push(`<button class="btn target" data-act="powerKnock" data-card="${ci}" data-p="${p}">${avatarHtml(seats()[p], p, 26)}<span>${esc(pl.name)}: ${c.placed[p].length} on the ${c.points}-point card</span></button>`);
    }));
    body = `<h2>${E.POWERS.knock.icon} ${E.POWERS.knock.name}</h2><p>Remove one die from a rival.</p>${rows.join('') || '<p class="none">Nobody has dice on a card.</p>'}<button class="btn" data-act="powerBack">Back</button>`;
  } else {
    const list = hand.length
      ? hand.map((k) => {
        const info = E.POWERS[k];
        const ok = myTurn && (k === 'bonus' || k === 'skip' ? !E.powerProblem(s, k) : E.powerMoves(s).some((m) => m.kind === k));
        return `<div class="pcard"><span class="pi">${info.icon}</span><div><b>${info.name}</b><small>${info.text}</small></div><button class="btn small" data-act="playPower" data-k="${k}" ${ok ? '' : 'disabled'}>Play</button></div>`;
      }).join('')
      : '<p class="none">You have no power cards. Claim a card worth 7 or more points, or roll three of a kind, to win one.</p>';
    const others = s.players.map((pl, p) => ({ pl, p })).filter(({ p }) => p !== holder && s.players[p].powers.length)
      .map(({ pl, p }) => `<div class="orow">${avatarHtml(seats()[p], p, 22)}<span>${esc(pl.name)}</span><b>⚡ ${pl.powers.length}</b></div>`).join('');
    body = `<h2>⚡ Power cards</h2>
      ${myTurn ? '<p class="tag">Play cards during your turn, after you roll.</p>' : '<p class="tag">You can play these on your own turn, after you roll.</p>'}
      ${list}
      ${others ? `<div class="sum"><div class="sumh">Rivals hold</div>${others}</div>` : ''}${close}`;
  }
  return `<div class="modal"><div class="sheet powers">${body}</div></div>`;
}

/** Pick the table colour, the back of the deck and the dice. Changes show straight away. */
const LISTS = { table: TABLES, back: BACKS, dice: DICE, fx: FX };
const nameOf = (part, id) => (LISTS[part].find((x) => x.id === id) || { name: id }).name;
const previewOf = (part, id) => (part === 'table' ? `<span class="tb" data-tb="${id}"></span>`
  : part === 'back' ? `<span class="bk" data-bk="${id}"></span>`
  : part === 'dice' ? `<span class="dpv" data-ds="${id}">${cube.on ? die3d(5, 'spin pv', 'style="--c:#e5484d"') : die(5, '')}</span>`
  : `<span class="fxp" aria-hidden="true">${{ confetti: '🎉', stars: '⭐', fireworks: '🎆', goldrain: '🪙' }[id] || '✨'}</span>`);

    return `<div class="modal"><div class="sheet shop themes"><h2>🛍 More looks</h2>
      <p class="note"><b>Everything is free right now.</b> Pick any look. Looks only change how the game looks.</p>

      <div class="calmrow"><span>Calm table <small style="font-weight:400;opacity:.7">(stops the moving looks)</small></span><button class="btn small" data-act="toggleCalm" aria-pressed="${calm.on}">${calm.on ? 'On' : 'Off'}</button></div>

    ${PARTS.filter(([part]) => SHOP[part]).map(([part, title]) => coinGroup(title, part)).join('')}
    <div class="calmrow"><span>Calm table <small style="font-weight:400;opacity:.7">(stops the moving looks)</small></span><button class="btn small" data-act="toggleCalm" aria-pressed="${calm.on}">${calm.on ? 'On' : 'Off'}</button></div>

function statusText(s) {
  const cur = s.players[s.current];
  const deck = s.deck.length ? ` <small>· ${s.deck.length} cards left</small>` : '';
  if (s.phase === 'over') return wins(s.players[s.winner].name);
  if (ui.rolling) return `${esc(cur.name)} rolls…`;
  if (cur.cpu) return `${esc(cur.name)} is thinking…${deck}`;
  if (ui.online && s.current !== net.mySeat) return (net.mySeat < 0 ? `Watching ${esc(cur.name)}…` : `${esc(cur.name)} is playing…`) + deck;
  if (s.phase === 'start') {
    return (E.handSize(s, s.current) === 0 ? 'All your dice are on cards. Take them back.' : `${esc(cur.name)}: roll your ${E.handSize(s, s.current)} dice`) + deck;
  }
  if (!s.rolled.length) return 'All dice placed';
  if (!E.legalMoves(s).length) return 'No matches this time';
  return ui.selected === null ? 'Tap a die, then the card it fits' : 'Tap a highlighted card';
}

/** A staggered pile of the cards a player has claimed, with their points showing. */
function pileHtml(pile = []) {
  if (!pile.length) return '<span class="pile blank" aria-hidden="true"></span>';
  const shown = pile.slice(-6);
  const more = pile.length - shown.length;
  return `<span class="pile" aria-label="${pile.length} cards claimed">${more ? `<em>+${more}</em>` : ''}${shown.map((pts, k) => `<i data-tier="${tierOf(pts)}" style="--n:${k}">${pts}</i>`).join('')}</span>`;
}

const tierOf = (points) => (points >= 13 ? 4 : points >= 9 ? 3 : points >= 5 ? 2 : 1);

/** A die on a card takes the colour of whoever covers it; several players split it into slices. */
const ownedClass = (owners) => (owners.length === 0 ? 'ghost' : owners.length === 1 ? 'owned' : 'owned shared');
function ownedStyle(owners, s) {
  if (!owners.length) return '';
  const seat = (p) => swatch(seats()[p], p);
  if (owners.length === 1) return `--c:${seat(owners[0]).hex};--pc:${seat(owners[0]).pip}`;
  const shown = owners.slice(0, 4); // a die is only so big
  const step = 100 / shown.length;
  const slices = shown.map((p, k) => `${seat(p).hex} ${(k * step).toFixed(1)}% ${((k + 1) * step).toFixed(1)}%`).join(', ');
  return `--c:${seat(shown[0]).hex};--bg:conic-gradient(${slices});--pc:#fff`;
}

/** For each die a card needs, the players covering it, in seat order. */
function slotOwners(s, card) {
  const used = new Map(); // per player, how many of each face already counted
  return card.need.map((face) => s.players.map((_, p) => p).filter((p) => {
    const key = `${p}:${face}`;
    const c = used.get(key) || 0;
    const has = card.placed[p].filter((f) => f === face).length;
    used.set(key, c + 1);
    return has > c;
  }));
}

const nameList = (s, ps) => ps.map((p) => s.players[p].name).join(', ');

function cardView(s, card, ci) {
  const accepts = ui.selected !== null && E.canPlace(s, ui.selected, ci);
  const n = card.need.length;
  // [dice per row, die size in % of card width]; sized so the block fits between the two corner numbers.
  const [cols, dz] = { 1: [1, 50], 2: [2, 40], 3: [3, 26], 4: [2, 40], 5: [3, 26] }[n] || [3, 24];
  const per = slotOwners(s, card);
  const slots = card.need.map((face, si) => {
    const owners = per[si];
    const peeked = ui.peek && ui.peek.card === ci && ui.peek.slot === si ? ' peeked' : '';
    const who = owners.length ? `covered by ${nameList(s, owners)}` : 'not covered yet';
    const badge = owners.length > 1 ? `<span class="badge" aria-hidden="true">${owners.length}</span>` : '';
    return `<button type="button" class="slot${peeked}" data-act="peek" data-card="${ci}" data-slot="${si}" data-o="${owners.length}" aria-label="Die ${face}, ${esc(who)}">
      <span class="dwrap">${die(face, ownedClass(owners), `style="${ownedStyle(owners, s)}"`)}${badge}</span></button>`;
  }).join('');
  return `<div class="gcard ${accepts ? 'accepts' : ''} ${ui.hint?.card === ci ? 'hinted' : ''}" data-tier="${tierOf(card.points)}" data-act="pickCard" data-card="${ci}" data-key="${String.fromCharCode(65 + ci)}" role="group" aria-label="${card.points} point card">
    <div class="corner tl"><b>${card.points}</b></div>
    <div class="face" style="--fc:${cols};--dz:${dz}">${slots}</div>
    <div class="corner br"><b>${card.points}</b></div>
  </div>`;
}

function gameView() {
  const s = ui.game;
  const human = isMine(s);
  const mine = seats()[s.current];
  const chips = s.players.map((p, i) => `
    <div class="chip ${i === s.current && s.phase !== 'over' ? 'active' : ''}" data-p="${i}" style="--c:${hexOf(i)}" ${canReact() ? 'data-act="reactMenu" role="button" tabindex="0" aria-label="Send an emoji"' : ''}>
      ${avatarHtml(seats()[i], i, 28)}
      <span class="meta"><span class="n">${esc(p.name)}${ui.online && i === net.mySeat ? ' (you)' : ''}</span><span class="s"><b class="num">${p.score}</b><small> / ${E.targetOf(s)}</small></span></span>
      ${pileHtml(p.pile)}
    </div>`).join('');

  let tray;
  let live = 0; // dice shown in the tray; the rest of the six are on cards
  if (s.phase === 'placing') {
    tray = s.rolled.map((f, i) => {
      const fx = ui.fx[i] || { delay: 0, dur: 0, dx: 0, rot: 0, sx: 0, sy: 0 };
      const spinning = ui.rolling && fx.dur > 0;
      const style = `${diceVars(mine, s.current)};--d:${fx.delay}ms;--dur:${fx.dur}ms;--dx:${fx.dx}px;--rot:${fx.rot}deg`;
      const face = spinning && !cube.on ? 1 + Math.floor(Math.random() * 6) : f;
      if (cube.on) {
        return die3d(face, `owned ${spinning ? 'rolling' : ''} ${ui.selected === i ? 'sel' : ''} ${ui.hint?.rolled === i ? 'hinted' : ''}`,
          `style="${style}" data-i="${i}" ${human && !ui.rolling ? `data-act="pickRolled" role="button" tabindex="0"` : 'aria-disabled="true"'}`, [fx.sx, fx.sy]);
      }
      return die(face, `owned ${spinning ? 'rolling' : ''} ${ui.selected === i ? 'sel' : ''} ${ui.hint?.rolled === i ? 'hinted' : ''}`,
        `style="${style}" data-i="${i}" ${human && !ui.rolling ? `data-act="pickRolled" role="button" tabindex="0"` : 'aria-disabled="true"'}`);
    }).join('');
    live = s.rolled.length;
  } else {
    live = E.handSize(s, s.current);
    tray = Array.from({ length: live }, () => (cube.on ? die3d(1, 'owned hand', `style="${diceVars(mine, s.current)}"`) : die(1, 'owned hand', `style="${diceVars(mine, s.current)}"`))).join('').replace(/aria-label="1"/g, 'aria-label="die in hand"');
  }
  // Always six places, so the tray (and with it the whole table) never changes height from turn to turn.
  tray += Array.from({ length: Math.max(0, E.diceOf(s) - live) }, () => `<div class="die empty" aria-label="die on a card">${'<i></i>'.repeat(9)}</div>`).join('');
  const onCards = E.diceOf(s) - E.handSize(s, s.current);
  const canTakeBack = human && s.phase === 'start' && onCards > 0;
  const mustTakeBack = canTakeBack && onCards === E.diceOf(s);
  const canRoll = human && s.phase === 'start' && E.handSize(s, s.current) > 0;
  const canEnd = human && s.phase === 'placing' && !ui.rolling;
  const noMoves = canEnd && !E.legalMoves(s).length;
  const extreme = s.mode === 'extreme';
  const holder = ui.online ? net.mySeat : s.current; // whose power cards the bolt button shows
  const held = extreme && holder >= 0 && Array.isArray(s.players[holder].powers) ? s.players[holder].powers.length : 0;
  const timed = extreme && human && s.phase !== 'over';

  return `
    <div class="game">
    <div class="table">
    <div class="score" data-rows="${Math.ceil(s.players.length / 4) > 1 ? 2 : 1}" style="--per:${Math.ceil(s.players.length / Math.ceil(s.players.length / 4))}">${chips}</div>
    ${ui.tut ? coachView() : `<div class="status"><span>${statusText(s)}</span></div>`}
    <div class="cards"><div class="cardgrid" data-n="${s.cards.length}">${s.cards.map((c, i) => cardView(s, c, i)).join('')}<div class="deckback ${extreme && s.chaos?.kind === 'double' ? 'x2on' : ''}" data-bk="${theme.back}" aria-hidden="true"><b>${s.deck.length}</b><span>left</span>${extreme && s.chaos?.kind === 'double' ? '<em class="x2">×2</em>' : ''}</div></div></div>
    </div>
    <div class="tray">
      ${timed ? `<div class="turnbar" style="--p:${turnFraction()}" aria-hidden="true"><i></i></div>` : ''}
      <div class="dice">${tray}</div>
      <div class="actions">
        ${s.phase === 'start' ? `
          <button class="btn primary ${canRoll ? 'pulse' : ''} ${ui.hint?.button === 'roll' ? 'hinted' : ''}" data-act="roll" ${canRoll ? '' : 'disabled'}>Roll</button>
          <button class="btn ${mustTakeBack ? 'primary pulse' : ''} ${ui.hint?.button === 'takeback' ? 'hinted' : ''}" data-act="takeBack" ${canTakeBack ? '' : 'disabled'} aria-label="Take back all your dice and roll all six">Take back<small>&amp; roll all</small></button>`
          : `<button class="btn ${noMoves ? 'primary pulse' : ''} ${ui.hint?.button === 'end' ? 'hinted' : ''}" data-act="end" ${canEnd ? '' : 'disabled'}>End turn</button>
          ${human && ui.undo.length ? '<button class="btn icon" data-act="undo" aria-label="Undo last placement" title="Undo">↶</button>' : ''}`}
        ${extreme ? `<button class="btn icon bolt" data-act="powers" aria-label="Power cards (${held})" title="Power cards" ${holder >= 0 ? '' : 'disabled'}>⚡${held ? `<span class="count">${held}</span>` : ''}</button>` : ''}
        <button class="btn icon" data-act="hint" aria-label="Hint" title="Hint" ${human && !ui.rolling ? '' : 'disabled'}>💡</button>
        <button class="btn icon" data-act="menu" aria-label="Menu">☰</button>
      </div>
    </div>
    </div>`;
}

/** Who covers the tapped die, and how far along each player is on this card. It follows the live game. */
function peekView() {
  const pk = ui.peek;
  const s = ui.game;
  const card = pk && s?.cards[pk.card];
  if (!card || card.id !== pk.id) { ui.peek = null; return ''; } // the card was claimed or replaced
  const owners = slotOwners(s, card)[pk.slot] || [];
  const face = card.need[pk.slot];
  const row = (p, extra = '') => `<div class="orow">${avatarHtml(seats()[p], p, 26)}<span>${esc(s.players[p].name)}${ui.online && p === net.mySeat ? ' <small>(you)</small>' : ''}</span>${extra}</div>`;
  const who = owners.length ? owners.map((p) => row(p)).join('') : '<div class="none">Nobody has this die yet.</div>';
  const total = card.need.length;
  const progress = s.players.map((pl, p) => ({ p, n: card.placed[p].length })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const sum = progress.length
    ? `<div class="sum"><div class="sumh">On this card</div>${progress.map((x) => row(x.p, `<b>${x.n}/${total}</b>`)).join('')}</div>`
    : '';
  return `<div class="peek" role="dialog" aria-label="Who has this die">
    <h3>${die(face, 'ghost', 'style="--size:22px"')}<span>${card.points}-point card</span></h3>${who}${sum}</div>`;
}

/** Anchor the popover under (or above) the die it is about, wherever the layout has put it. */
function positionPeek() {
  const pop = app.querySelector('.peek');
  const slot = ui.peek && app.querySelector(`.slot[data-card="${ui.peek.card}"][data-slot="${ui.peek.slot}"]`);
  if (!pop || !slot) return;
  const r = slot.getBoundingClientRect();
  const width = Math.min(260, window.innerWidth - 16);
  const left = Math.max(8, Math.min(window.innerWidth - width - 8, r.left + r.width / 2 - width / 2));
  const room = window.innerHeight - (r.bottom + 8);
  pop.style.width = `${width}px`;
  pop.style.left = `${left}px`;
  if (room >= pop.offsetHeight || room >= r.top - 8) pop.style.top = `${r.bottom + 8}px`;
  else { pop.style.top = `${r.top - 8}px`; pop.style.transform = 'translateY(-100%)'; }
}

function editorView() {
  const ed = ui.ed;
  const taken = new Set(editorTaken());
  const ink = INK.map((hex) => `<button class="ink ${!ed.sk.erase && !ed.sk.stamp && ed.sk.ink === hex ? 'on' : ''}" style="--c:${hex}" data-act="ink" data-c="${hex}" aria-label="Ink ${hex}"></button>`).join('')
    + `<button class="ink eraser ${ed.sk.erase ? 'on' : ''}" data-act="eraser" aria-label="Eraser">⌫</button>`;
  const brushes = BRUSHES.map((w) => `<button class="brush ${ed.sk.width === w ? 'on' : ''}" data-act="brush" data-w="${w}" aria-label="Brush size ${w}"><i style="--w:${w}px"></i></button>`).join('');
  const stamps = STAMPS.map((g) => `<button class="stamp ${ed.sk.stamp === g ? 'on' : ''}" data-act="stamp" data-g="${g}" aria-label="Stamp ${g}">${g}</button>`).join('');
  const colors = PALETTE.map((c, i) => `<button class="swatch ${ed.color === i ? 'on' : ''}" style="--c:${c.hex}" data-act="pickColor" data-i="${i}" ${taken.has(i) ? 'disabled' : ''} aria-label="${c.name} dice${taken.has(i) ? ' (taken)' : ''}"></button>`).join('');
  return `<div class="modal"><div class="sheet editor"><h2>Your player</h2>
    <p class="note">Draw your icon with your finger. Your dice colour becomes its ring.</p>
    <div class="avwrap"><canvas id="avcv" width="${AVATAR_SIZE}" height="${AVATAR_SIZE}" aria-label="Drawing area"></canvas></div>
    <div class="tools">${ink}</div>
    <div class="tools"><span class="brushes">${brushes}</span><button class="btn small" data-act="clearArt">Clear</button></div>
    <p class="note">Or press a stamp. The size buttons change stamps too.</p>
    <div class="tools stamps">${stamps}</div>
    <p class="note">Dice colour. Each player needs a different one.</p>
    <div class="tools">${colors}</div>
    <div class="row2"><button class="btn" data-act="closeEditor">Cancel</button><button class="btn primary" data-act="saveEditor">Save</button></div>
  </div></div>`;
}

const lookName = ({ part, id }) => `${({ table: TABLES, back: BACKS, dice: DICE }[part].find((x) => x.id === id) || { name: id }).name} ${({ table: 'table', back: 'deck back', dice: 'dice' })[part]}`;
const unlockedLine = () => (ui.coinsEarned && !freeLooks() ? `<p class="unlock coins">🪙 +${ui.coinsEarned} coins</p>` : '') + (ui.newUnlocks.length ? `<p class="unlock">🔓 Unlocked: ${ui.newUnlocks.map(lookName).join(', ')}. See 🎨 Themes.</p>` : '');

/** What the app was doing, without anything personal: for a problem report. */
const reportContext = () => ({
  Screen: ui.screen,
  Game: ui.game ? `${ui.game.mode}, ${ui.game.players.length} players, to ${E.targetOf(ui.game)}, ${E.diceOf(ui.game)} dice, phase ${ui.game.phase}` : 'none',
  Online: ui.online ? `${net.store?.kind || '?'} (${ui.conn})` : 'no',
});

function reportView() {
  const text = buildReport(ui.reportNote, reportContext());
  const mail = typeof window.RFI_FEEDBACK_EMAIL === 'string' && window.RFI_FEEDBACK_EMAIL.includes('@');
  const n = errorLog().length;
  return `<div class="modal"><div class="sheet report"><h2>Report a problem</h2>
    <p class="tag">Tell us what happened. The report holds your device and browser, what the app was doing, and the ${n} recent error${n === 1 ? '' : 's'} it noted. No names, room codes or drawings. Nothing is sent until you choose how.</p>
    <textarea id="reportnote" rows="3" maxlength="1000" placeholder="What went wrong? What were you doing?" aria-label="What happened">${esc(ui.reportNote)}</textarea>
    <details><summary>See the report</summary><pre>${esc(text)}</pre></details>
    ${navigator.share ? '<button class="btn primary" data-act="reportShare">Share…</button>' : ''}
    <button class="btn ${navigator.share ? '' : 'primary'}" data-act="reportCopy">Copy report</button>
    ${mail ? '<button class="btn" data-act="reportMail">Email it</button>' : ''}
    ${n ? '<button class="btn" data-act="reportClear">Clear the error log</button>' : ''}
    <button class="btn" data-act="about">Back</button></div></div>`;
}

/** The room as a QR code: a friend points their camera at it and the app opens with the code filled in. */
const canShowQr = () => net.store?.kind === 'p2p' && typeof window.qrcode === 'function' && !!net.room?.code;

function qrView() {
  if (!canShowQr()) return '';
  const code = net.room.code;
  const url = `${location.origin}${location.pathname}#${code}`;
  let svg = '';
  try {
    const q = window.qrcode(0, 'M'); // the smallest size that holds the address, with some error correction
    q.addData(url);
    q.make();
    svg = q.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
  } catch { return ''; }
  return `<div class="modal"><div class="sheet qr"><h2>Scan to join</h2>
    <div class="qrbox" role="img" aria-label="QR code for room ${esc(code)}">${svg}</div>
    <p class="qrcode">${esc(code)}</p>
    <p class="tag">Point a phone's camera at this. It opens Rollick with the room code filled in.</p>
    <button class="btn primary" data-act="closeModal">Done</button></div></div>`;
}
