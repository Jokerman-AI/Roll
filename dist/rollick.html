<title>Rollick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { color-scheme: dark; }
:root {
  --felt: #0f3d2e;
  --felt-2: #14513d;
  --ink: #f6f1e1;
  --muted: #a9c4b8;
  --card: #fff8e7;
  --card-ink: #2b2417;
  --p0: #e5484d; --p1: #3b82f6; --p2: #2fb36d; --p3: #f5a524;
  --radius: 16px;
  /* dice scale with the screen: width on phones, height when it is short (landscape, folded) */
  --cd: clamp(30px, min(10.5vw, 5.8dvh), 56px);
  --td: clamp(38px, min(13vw, 7dvh), 68px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 50% 0%, var(--felt-2), var(--felt));
  color: var(--ink);
  font: clamp(14px, 1.1vw + 10.5px, 18px)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation; /* no double-tap zoom delay; pinch zoom still works */
}
/* Safari will not let people type in a field inside a user-select:none page unless it opts back in */
input, textarea { -webkit-user-select: text; user-select: text; }
/* dice tumbling in from the side must not make the page scroll sideways */
#app {
  overflow-x: clip;
  min-height: 100dvh; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
}
@media (min-width: 700px) { #app { max-width: 720px; } }
button { font: inherit; color: inherit; cursor: pointer; }
h1 { font-size: 2.4rem; margin: 0; letter-spacing: -.02em; }

.btn {
  border: 0; border-radius: 14px; padding: 14px 20px; font-weight: 700;
  background: #ffffff1f; min-height: 48px;
}
.btn.primary { background: #ffd34d; color: #3a2a00; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pulse:not(:disabled) { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px #ffd34d44; } }

/* setup */
.setup { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.setup .tag { color: var(--muted); margin: 0 0 8px; }
.prow { display: flex; gap: 6px; align-items: center; }
.prow .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.prow input {
  flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 0;
  background: #ffffff1f; color: var(--ink); font: inherit;
}
.prow .btn { padding: 10px 9px; min-height: 44px; font-size: 0.9rem; }
.prow .btn[data-act=removePlayer], .prow .btn[data-act=removeSeat] { padding: 10px 0; width: 40px; }
.prow input { min-width: 70px; }

/* scoreboard */
.score { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  flex: 1 1 calc(100% / var(--per, 4) - 8px); min-width: 0; padding: 6px 8px; border-radius: 12px; background: #00000030;
  border: 2px solid transparent; display: flex; align-items: center; gap: 8px;
}
.chip.active { border-color: var(--c); background: #00000055; box-shadow: 0 0 0 2px #ffffff30; }
.chip { container-type: inline-size; justify-content: center; }
@container (max-width: 70px) { .chip .n { display: none; } .chip .av { width: 20px; height: 20px; } .chip .s { font-size: 1rem; } .chip .meta { flex: 0 0 auto; align-items: center; } }
@container (max-width: 112px) { .chip .s small { display: none; } .chip .av { width: 24px; height: 24px; } .chip .s { font-size: 1.1rem; } }
.chip .meta { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
.chip .n { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .s { font-size: 1.3rem; font-weight: 800; line-height: 1.1; white-space: nowrap; }
@media (max-width: 360px) { .chip .s small { display: none; } }
.chip .s small { font-size: .75rem; color: var(--muted); font-weight: 600; }

.status { text-align: center; font-weight: 600; display: block; height: 1.6em; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* one fixed line, so a long message never resizes the table; the end is trimmed first */

/* cards: laid out as a grid of playing cards, sized to whatever room the table has */
.cards { container-type: size; min-width: 0; min-height: min(38dvh, 260px); }
.cardgrid {
  --gap: 10px; --cols: 3; --rows: 1;
  display: grid; grid-template-columns: repeat(var(--cols), auto); gap: var(--gap);
  justify-content: center; align-content: center; height: 100%;
}
.cardgrid[data-n="1"] { --cols: 1; }
.cardgrid[data-n="2"] { --cols: 2; }
.cardgrid[data-n="4"] { --cols: 4; }
/* Portrait phones tall enough use two rows, and the free fourth place shows the deck.
   This is chosen from the screen's size only, never from the table's live size, so it cannot flip during a game. */
@media (orientation: portrait) and (min-height: 700px) { .cardgrid[data-n="3"] { --cols: 2; --rows: 2; } .cardgrid[data-n="3"] .deckback { display: grid; } }
@media (orientation: portrait) and (min-height: 540px) { .cardgrid[data-n="4"] { --cols: 2; --rows: 2; } }

.gcard, .deckback {
  width: min(calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols)), calc((100cqh - (var(--rows) - 1) * var(--gap)) * 5 / (7 * var(--rows))), 200px);
  aspect-ratio: 5 / 7; border-radius: clamp(8px, 1.2vw + 4px, 14px);
}
.gcard {
  --tier: #5f8a62;
  container-type: inline-size; position: relative; padding: 0;
  color: var(--card-ink); background: linear-gradient(160deg, #fffdf4, #f4ecd3);
  border: 1px solid #cdbf93;
  box-shadow: 0 8px 16px #0006, inset 0 0 0 4px #fffdf4, inset 0 0 0 5px var(--tier);
  transition: transform .15s, box-shadow .15s; cursor: pointer;
}
.gcard[data-tier="2"] { --tier: #3b78c2; }
.gcard[data-tier="3"] { --tier: #8a3fb0; }
.gcard[data-tier="4"] { --tier: #b9861f; background: linear-gradient(160deg, #fffbe6, #f0dca6); }
.gcard.accepts { transform: translateY(-8px) scale(1.04); box-shadow: 0 0 0 3px #ffd34d, 0 16px 24px #000a, inset 0 0 0 4px #fffdf4, inset 0 0 0 5px var(--tier); }
.corner { position: absolute; line-height: 1; color: var(--tier); font-weight: 900; }
.corner b { font-size: clamp(14px, 16cqw, 34px); }
.corner.tl { top: 6cqw; left: 8cqw; }
.corner.br { bottom: 6cqw; right: 8cqw; transform: rotate(180deg); }
/* the dice sit in the band between the two corner numbers, so they can never overlap them */
.face {
  --fc: 1; position: absolute; left: 8cqw; right: 8cqw; top: 27cqw; bottom: 27cqw;
  display: flex; flex-wrap: wrap; gap: 3cqw; justify-content: center; align-content: center;
}
.slot { flex: 0 0 calc((100% - (var(--fc) - 1) * 3cqw) / var(--fc)); display: flex; flex-direction: column; align-items: center; }
.face .die, .face .dwrap { --size: calc(var(--dz, 30) * 1cqw); }
.slot { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.dwrap { position: relative; display: block; width: var(--size); height: var(--size); }
/* count of players covering a die, shown only when it is shared */
.badge {
  position: absolute; top: 0; right: 0; transform: translate(45%, -45%); z-index: 2;
  width: max(14px, calc(var(--size) * .32)); height: max(14px, calc(var(--size) * .32)); border-radius: 50%;
  display: grid; place-items: center; background: #1d2b24; color: #fff;
  font: 800 max(9px, calc(var(--size) * .2))/1 system-ui, sans-serif; box-shadow: 0 0 0 2px #fffdf4;
}
.slot.peeked .die { outline: 3px solid #ffd34d; outline-offset: 2px; }
.deckback {
  display: none; place-items: center; align-content: center; color: #fff; text-align: center; line-height: 1.1;
  background: repeating-linear-gradient(45deg, #1d4f8f 0 7px, #2a63ad 7px 14px);
  border: 3px solid #fffdf4; box-shadow: 0 8px 16px #0006;
}
.deckback b { font-size: 1.6rem; }
.deckback span { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
/* dice */
.die {
  --size: var(--cd); --bg: #fff; --pip: #222;
  width: var(--size); height: var(--size); border-radius: calc(var(--size) * .22);
  background: var(--bg); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: calc(var(--size) * .14); box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0003, 0 0 0 1px #ffffff26;
  flex: none;
}
.die i { border-radius: 50%; margin: 12%; }
.die i.on { background: var(--pip); }
.die.ghost { --bg: #e8dfc4; --pip: #8a7a55; box-shadow: inset 0 0 0 2px #c9bc96; }
.die.mine, .die.owned { --bg: var(--c); --pip: var(--pc, #fff); }
/* a die covered by several players is split into slices of their colours; pips get an outline to stay readable */
.die.shared i.on { box-shadow: 0 0 0 1px #0007; }
.die.hand { opacity: .55; }
.die.empty { --bg: transparent; box-shadow: none; border: 2px dashed #ffffff30; }
.die.empty i { display: none; }

/* tray */
.tray { background: #00000030; border-radius: var(--radius); padding: 12px; }
.dice { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: var(--td); align-items: center; }
.dice .die { --size: var(--td); }
.dice button.die { border: 0; }
.dice button.die.sel { outline: 4px solid #ffd34d; outline-offset: 2px; }
/* tumbling roll: each die flies in, bounces, and lands upright at its own time */
.dice .die { position: relative; z-index: 2; }
.dice .die.rolling { animation: tumble var(--dur) cubic-bezier(.25, .7, .35, 1) var(--d) both; }
@keyframes tumble {
  0% { transform: translate(var(--dx), -120px) rotate(0deg) scale(.55); opacity: 0; }
  12% { opacity: 1; }
  55% { transform: translate(calc(var(--dx) * .25), 0) rotate(calc(var(--rot) * .75)) scale(1.1); }
  72% { transform: translate(0, -26px) rotate(calc(var(--rot) * .92)) scale(1.02); }
  88% { transform: translate(0, 0) rotate(var(--rot)) scale(.96); }
  100% { transform: translate(0, 0) rotate(var(--rot)) scale(1); }
}
.dice .hint { color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 10px; }
.actions .btn { flex: 1; }

/* overlays */
.toast {
  position: fixed; left: 50%; top: 80px; transform: translateX(-50%);
  background: #06130d; padding: 10px 16px; border-radius: 999px; font-weight: 700;
  max-width: 90vw; text-align: center; pointer-events: none; z-index: 30;
}
[hidden] { display: none !important; }
.modal {
  position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.sheet {
  background: var(--card); color: var(--card-ink); border-radius: 20px; padding: 20px;
  max-width: 460px; width: 100%; max-height: 85vh; overflow: auto;
}
.sheet h2 { margin-top: 0; }
.sheet ol, .sheet ul { padding-left: 1.2em; }
.sheet .btn { background: #0001; width: 100%; margin-top: 8px; }
.sheet .btn.primary { background: #ffd34d; }
.winner { text-align: center; }
.winner .big { font-size: 2.2rem; font-weight: 900; }
.trophy { display: flex; justify-content: center; margin-bottom: 6px; }
.scores { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.srow { display: flex; align-items: center; gap: 10px; text-align: left; }
.srow > span:not(.av) { flex: 1; }
.srow .av { flex: none; }
.sheet .btn.small { width: auto; min-height: 40px; padding: 8px 14px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.code { color: #ffd34d; letter-spacing: .15em; }
.setup small { color: var(--muted); font-size: .75rem; }

/* ---- game layout: one column on portrait phones ---- */
.game {
  flex: 1; display: grid; gap: 10px; min-height: 0;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "score" "status" "cards" "tray";
}
.table { display: contents; }
.score { grid-area: score; }
.status { grid-area: status; }
.cards { grid-area: cards; }
.tray { grid-area: tray; }
.modal { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* ---- landscape phones, tablets, unfolded foldables: cards left, controls right ---- */
@media (orientation: landscape) and (min-width: 480px) {
  #app { max-width: 1000px; }
  .game {
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "cards score" "cards status" "cards tray";
    column-gap: 16px;
  }
  .tray { align-self: end; }
}

/* ---- dual-screen, side by side (Surface Duo open like a book): one screen each side of the hinge ---- */
@media (horizontal-viewport-segments: 2) {
  #app { max-width: none; padding-inline: 0; }
  .game {
    grid-template-columns: env(viewport-segment-width 0 0, 1fr) env(viewport-segment-width 1 0, 1fr);
    column-gap: calc(env(viewport-segment-left 1 0, 0px) - env(viewport-segment-right 0 0, 0px));
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "cards score" "cards status" "cards tray";
  }
  .cards, .score, .status, .tray { margin-inline: 16px; }
  .setup { max-width: env(viewport-segment-width 0 0, 560px); padding-inline: 16px; }
}

/* ---- dual-screen, top and bottom (Surface Duo in laptop posture): table above the hinge, dice below ---- */
@media (vertical-viewport-segments: 2) {
  #app { max-width: none; padding: 0; }
  .game {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: env(viewport-segment-height 0 0, 1fr) env(viewport-segment-height 0 1, 1fr);
    row-gap: calc(env(viewport-segment-top 0 1, 0px) - env(viewport-segment-bottom 0 0, 0px));
    grid-template-areas: "table" "tray";
  }
  .table { display: flex; flex-direction: column; gap: 10px; grid-area: table; min-height: 0; padding: 12px 16px; }
  .tray { align-self: center; width: min(560px, calc(100% - 32px)); }
}

/* ---- short landscape screens (a small phone on its side): tighter controls ---- */
@media (orientation: landscape) and (max-height: 430px) {
  :root { --td: clamp(26px, 9dvh, 56px); }
  #app { padding-block: 8px; }
  .game { gap: 6px; }
  .btn { min-height: 40px; padding: 8px 12px; }
  .tray { padding: 6px; }
  .dice { gap: 6px; }
  .actions { margin-top: 6px; }
  .status { font-size: .85rem; line-height: 1.2; }
  .score { gap: 4px; }
  .chip { padding: 3px 5px; }
  .actions .btn:not(.icon) { white-space: nowrap; font-size: .85rem; padding-inline: 8px; }
  .btn.icon { min-width: 40px; padding: 0 8px; }
}

/* ---- very small screens ---- */
@media (max-height: 640px) { .pile i { width: 12px; height: 17px; font-size: 8px; line-height: 14px; } .game { gap: 6px; } .cardgrid { --gap: 6px; } .score { gap: 6px; } .pile { min-height: 17px; } .chip { padding: 5px 8px; } .chip .s { font-size: 1.1rem; } .chip .av { width: 24px; height: 24px; } .chip { gap: 6px; } .tray { padding: 8px; } .btn { min-height: 44px; padding: 10px 14px; } }

/* ---- player icons and the editor ---- */
.av {
  --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c);
  display: grid; place-items: center; overflow: hidden; flex: none; box-shadow: 0 0 0 2px #ffffff40;
  box-sizing: border-box;
}
.av.pic { background: #fffdf4; border: clamp(2px, calc(var(--s) * .09), 5px) solid var(--c); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av b { font-size: calc(var(--s) * .5); line-height: 1; }
.avbtn { position: relative; background: none; border: 0; padding: 0; border-radius: 50%; flex: none; }
.avbtn::after {
  content: "✎"; position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%;
  background: #ffd34d; color: #3a2a00; font-size: 11px; display: grid; place-items: center;
}
.editor .note { margin: 6px 0 0; color: #6b5d3b; font-size: .9rem; }
.avwrap {
  width: min(62vw, 240px); aspect-ratio: 1; margin: 10px auto; border-radius: 50%; background: #fffdf4;
  overflow: hidden; box-shadow: 0 0 0 3px #0003; touch-action: none;
}
#avcv { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 8px 0; }
.brushes { display: flex; gap: 8px; }
.ink, .swatch { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 3px solid #0003; padding: 0; }
.ink.on, .swatch.on, .brush.on { outline: 3px solid #2b2417; outline-offset: 2px; }
.eraser { background: #fff; color: #333; font-weight: 800; }
.swatch { width: 40px; height: 40px; }
.swatch:disabled { opacity: .25; cursor: default; }
.brush { width: 40px; height: 40px; border-radius: 12px; background: #0001; border: 0; display: grid; place-items: center; }
.brush i { width: var(--w); height: var(--w); border-radius: 50%; background: #2b2417; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.row2 .btn { margin: 0; }
.avbtn:focus-visible, .btn:focus-visible, .ink:focus-visible, .swatch:focus-visible { outline: 3px solid #ffd34d; outline-offset: 2px; }

/* ---- claimed-card piles, celebrations, hints, connection banner ---- */
.chip .s .num { font-variant-numeric: tabular-nums; display: inline-block; }
.chip.bump { animation: bump .6s ease-out; }
@keyframes bump { 30% { transform: scale(1.08); box-shadow: 0 0 0 4px #ffd34d88; } }
.chip { flex-wrap: wrap; }
.pile { display: flex; align-items: center; flex: 1 0 100%; margin-top: 1px; padding-left: 2px; min-width: 0; overflow: hidden; min-height: 21px; }
.pile.blank { visibility: hidden; }
.score[data-rows="2"] .pile.blank { display: none; } /* tall scoreboards give the space back until a first card is claimed */
.pile i {
  --tier: #5f8a62; width: 15px; height: 21px; margin-left: -6px; border-radius: 3px; flex: none;
  background: #fffdf4; border: 1.5px solid var(--tier); color: var(--tier);
  font: 800 9px/18px system-ui, sans-serif; font-style: normal; text-align: center;
  box-shadow: -1px 1px 2px #0005; transform: rotate(calc((var(--n, 0) - 2) * 2deg));
}
.pile i:first-of-type { margin-left: 0; }
.pile i[data-tier="2"] { --tier: #3b78c2; }
.pile i[data-tier="3"] { --tier: #8a3fb0; }
.pile i[data-tier="4"] { --tier: #b9861f; background: #f6e7b5; }
.pile em { font-style: normal; font-size: .65rem; color: var(--muted); margin-right: 6px; }

.fly { position: fixed; z-index: 25; pointer-events: none; will-change: transform, opacity; }
.fly .gcard { width: 100%; height: 100%; aspect-ratio: auto; transform: none; box-shadow: 0 10px 22px #000a; }

.confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
.confetti i {
  position: absolute; top: -16px; width: 9px; height: 14px; border-radius: 2px;
  animation: confetti-fall 3s cubic-bezier(.3, .6, .5, 1) forwards;
}
@keyframes confetti-fall {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--dx), 110vh) rotate(var(--spin)); opacity: .9; }
}

.hinted { animation: hint-glow 0.9s ease-in-out infinite; }
.dice .die.hinted { outline: 4px solid #ffd34d; outline-offset: 3px; }
.gcard.hinted { box-shadow: 0 0 0 4px #ffd34d, 0 14px 22px #000a, inset 0 0 0 4px #fffdf4, inset 0 0 0 5px var(--tier); }
@keyframes hint-glow { 50% { filter: brightness(1.22); transform: translateY(-4px); } }

.btn.icon { flex: 0 0 auto; min-width: 48px; padding: 0 12px; font-size: 1.15rem; }
.actions .btn.icon { flex: 0 0 auto; }

.conn {
  position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
  background: #b9861f; color: #fff; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .9rem; white-space: nowrap;
}
.conn.lost { background: #b3382f; }
.conn button { margin-left: 8px; border: 0; border-radius: 999px; padding: 4px 10px; font-weight: 800; background: #fff; color: #b3382f; }

.stamps { gap: 6px; }
.stamp { width: 42px; height: 42px; border-radius: 12px; border: 0; background: #0001; font-size: 1.4rem; line-height: 1; padding: 0; }
.stamp.on { outline: 3px solid #2b2417; outline-offset: 2px; background: #fff; }

/* ---- who-has-this-die popover ---- */
.peek {
  position: fixed; z-index: 15; background: var(--card); color: var(--card-ink); border-radius: 14px; padding: 12px;
  box-shadow: 0 14px 30px #000a, 0 0 0 1px #0002; font-size: .95rem;
}
.peek h3 { margin: 0 0 6px; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.peek .orow { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.peek .orow > span:not(.av) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.peek .orow .av { flex: none; }
.peek .orow small { color: #6b5d3b; }
.peek .none { color: #6b5d3b; padding: 2px 0; }
.peek .sum { border-top: 1px solid #0002; margin-top: 8px; padding-top: 6px; }
.peek .sumh { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: #6b5d3b; margin-bottom: 2px; }

</style>
<div id="app"></div>
<script>
const E = (() => {
// Pure game rules for Rollick. No DOM access; every transition returns a new state.

const DICE_PER_PLAYER = 6;
const TARGET_SCORE = 40;
const MAX_PLAYERS = 8; // one set plays 2-4; two sets play up to 8

// One 30-card set: [shape, points]. A shape lists how many dice of each distinct face a card
// needs, so [2, 1] is "a pair plus one other number". Three cards per tier.
// Points track difficulty: the expected turns to finish each shape (simulated, rolling every free
// die each turn and placing every match) are shown alongside, so harder cards are worth more.
const SET_SHAPES = [
  [[1], 2], //          1.5 turns
  [[1, 1], 3], //       2.0
  [[2], 4], //          2.5
  [[2, 1], 5], //       3.1
  [[1, 1, 1, 1], 6], // 3.3
  [[2, 2], 7], //       4.2
  [[3, 1], 9], //       4.7
  [[2, 2, 1], 11], //   5.6
  [[3, 2], 13], //      6.4
  [[5], 15], //         8.5
];
const CARDS_PER_SHAPE = 3;

const shapeOf = (faces) => {
  const counts = new Map();
  for (const f of faces) counts.set(f, (counts.get(f) || 0) + 1);
  return [...counts.values()].sort((a, b) => b - a).join(',');
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function multisets(size, min = 1) {
  if (size === 0) return [[]];
  const out = [];
  for (let f = min; f <= 6; f++) {
    for (const rest of multisets(size - 1, f)) out.push([f, ...rest]);
  }
  return out;
}

function buildDeck(rng, sets = 1) {
  const deck = [];
  for (let s = 0; s < sets; s++) {
    for (const [shape, points] of SET_SHAPES) {
      const size = shape.reduce((a, b) => a + b, 0);
      const key = [...shape].sort((a, b) => b - a).join(',');
      const pool = multisets(size).filter((m) => shapeOf(m) === key);
      for (const need of shuffle(pool, rng).slice(0, CARDS_PER_SHAPE)) deck.push({ points, need });
    }
  }
  return shuffle(deck, rng);
}

const cardsInPlay = (playerCount) => (playerCount >= 5 ? 4 : 3);

/** The faces `player` still needs on `card`. */
function missing(card, player) {
  const left = [...card.need];
  for (const f of card.placed[player]) {
    const i = left.indexOf(f);
    if (i >= 0) left.splice(i, 1);
  }
  return left;
}

function handSize(state, player) {
  const onCards = state.cards.reduce((n, c) => n + c.placed[player].length, 0);
  return DICE_PER_PLAYER - onCards;
}

/** Everyone rolls two dice; highest total goes first, ties roll again. */
function rollOff(count, rng) {
  let contenders = Array.from({ length: count }, (_, i) => i);
  let rolls = [];
  while (contenders.length > 1) {
    rolls = contenders.map((i) => ({ i, total: 2 + Math.floor(rng() * 6) + Math.floor(rng() * 6) }));
    const top = Math.max(...rolls.map((r) => r.total));
    contenders = rolls.filter((r) => r.total === top).map((r) => r.i);
  }
  return { first: contenders[0], total: rolls.length ? rolls.find((r) => r.i === contenders[0]).total : 0 };
}

const LEVEL_NAMES = ['easy', 'normal', 'hard'];

function newGame(configs, rng = Math.random) {
  if (configs.length < 2 || configs.length > MAX_PLAYERS) throw new Error('2-8 players');
  const players = configs.map((c) => ({ name: c.name, cpu: !!c.cpu, level: LEVEL_NAMES.includes(c.level) ? c.level : 'normal', score: 0, pile: [] })); // pile: points of cards claimed
  const { first, total } = rollOff(players.length, rng);
  const state = {
    players,
    deck: buildDeck(rng, players.length > 4 ? 2 : 1),
    cards: [],
    current: first,
    firstRoll: total,
    phase: 'start', // start -> placing -> (next player's) start ... -> over
    rolled: [],
    winner: null,
    lastClaim: null,
    nextId: 1,
  };
  for (let i = 0; i < cardsInPlay(players.length); i++) draw(state);
  return state;
}

function draw(state) {
  const base = state.deck.shift();
  if (!base) return false;
  state.cards.push({
    id: state.nextId++,
    points: base.points,
    need: base.need,
    placed: state.players.map(() => []),
  });
  return true;
}

function assertPhase(state, phase) {
  if (state.phase !== phase) throw new Error(`Expected phase ${phase}, got ${state.phase}`);
}

/** Take Back: before rolling, return ALL of your dice from the trays to your hand. */
function takeBack(state) {
  assertPhase(state, 'start');
  const s = structuredClone(state);
  s.lastClaim = null;
  for (const c of s.cards) c.placed[s.current] = [];
  return s;
}

function roll(state, rng = Math.random) {
  assertPhase(state, 'start');
  const n = handSize(state, state.current);
  if (n <= 0) throw new Error('No dice in hand; take them back first');
  const s = structuredClone(state);
  s.lastClaim = null;
  s.rolled = Array.from({ length: n }, () => 1 + Math.floor(rng() * 6));
  s.phase = 'placing';
  return s;
}

function canPlace(state, rolledIdx, cardIdx) {
  if (state.phase !== 'placing') return false;
  const face = state.rolled[rolledIdx];
  const card = state.cards[cardIdx];
  return face !== undefined && !!card && missing(card, state.current).includes(face);
}

function legalMoves(state) {
  const moves = [];
  if (state.phase !== 'placing') return moves;
  state.rolled.forEach((_, r) => {
    state.cards.forEach((_, c) => {
      if (canPlace(state, r, c)) moves.push({ rolled: r, card: c });
    });
  });
  return moves;
}

function place(state, rolledIdx, cardIdx) {
  if (!canPlace(state, rolledIdx, cardIdx)) throw new Error('Illegal placement');
  const s = structuredClone(state);
  s.lastClaim = null;
  const p = s.current;
  const card = s.cards[cardIdx];
  card.placed[p].push(s.rolled[rolledIdx]);
  s.rolled.splice(rolledIdx, 1);

  if (missing(card, p).length === 0) {
    s.players[p].score += card.points;
    s.players[p].pile = [...(s.players[p].pile || []), card.points];
    s.lastClaim = { player: p, points: card.points, need: card.need };
    // Every player's dice on the claimed card go back to their hands.
    s.cards.splice(cardIdx, 1);
    draw(s);
    if (s.players[p].score >= TARGET_SCORE) {
      s.phase = 'over';
      s.winner = p;
    } else if (s.cards.length === 0) {
      s.phase = 'over';
      s.winner = s.players.reduce((best, pl, i) => (pl.score > s.players[best].score ? i : best), 0);
    }
  }
  return s;
}

/** Leftover rolled dice return to hand; play passes on. */
function endTurn(state) {
  assertPhase(state, 'placing');
  const s = structuredClone(state);
  s.lastClaim = null;
  s.rolled = [];
  s.current = (s.current + 1) % s.players.length;
  s.phase = 'start';
  return s;
}

return { DICE_PER_PLAYER, TARGET_SCORE, MAX_PLAYERS, mulberry32, buildDeck, cardsInPlay, missing, handSize, LEVEL_NAMES, newGame, takeBack, roll, canPlace, legalMoves, place, endTurn };
})();

// The computer player. It only uses what every player can see: the cards, everyone's dice and scores.
// To judge a choice it plays out the next couple of turns many times (a quick Monte Carlo look-ahead)
// with a simple "place every die where it helps most" policy, and picks the option that scores best.
// The simulations use a generator seeded from the position, so the same position always gets the same
// answer, which also keeps the hint button consistent.

const LOOKAHEAD = 3; // turns to play out, including the current one
const SIMS = 64; // playouts per option

/** Chance we still get a card first, given how close the nearest rival is. */
function race(missing, rival) {
  if (rival < missing) return 0.35;
  if (rival === missing) return 0.7;
  return 1;
}

/** What I know about each card, reduced to counts so playouts are cheap. */
function snapshot(s, me) {
  const cards = s.cards.map((card) => {
    const need = new Array(7).fill(0);
    const have = new Array(7).fill(0);
    for (const f of card.need) need[f]++;
    for (const f of card.placed[me]) have[f]++;
    let rival = Infinity;
    s.players.forEach((_, p) => { if (p !== me) rival = Math.min(rival, E.missing(card, p).length); });
    return { points: card.points, need, have, total: card.need.length, placed: card.placed[me].length, rival, alive: true };
  });
  const topRival = Math.max(0, ...s.players.filter((_, p) => p !== me).map((p) => p.score));
  return { cards, onCards: cards.reduce((n, c) => n + c.placed, 0), score: s.players[me].score, topRival };
}

const copyModel = (m) => ({ ...m, cards: m.cards.map((c) => ({ ...c, have: c.have.slice() })) });

/** What finishing a card is worth. `certain` means it happens this turn, with dice already rolled. */
function completionValue(c, certain, score, topRival) {
  let v = c.points * (certain ? 1 : race(1, c.rival));
  if (score + c.points >= E.TARGET_SCORE) v += certain ? 1000 : 25 * race(1, c.rival); // winning
  if (c.rival <= 1) {
    v += 0.3 * c.points; // taking a card a rival is about to finish
    if (topRival + c.points >= E.TARGET_SCORE) v += certain ? 10 : 3; // ...especially if it would win them the game
  }
  return v;
}

/** Place one die on a card (the card must need it). Returns the value gained if that finished the card. */
function put(m, c, face, certain) {
  c.have[face]++;
  c.placed++;
  m.onCards++;
  if (c.placed < c.total) return 0;
  const gained = completionValue(c, certain, m.score, m.topRival);
  m.score += c.points;
  m.onCards -= c.total; // the dice on a finished card come home
  c.alive = false;
  return gained;
}

/** Play `turns` turns with a simple policy and return what they were worth. `firstDice` are this turn's dice if already rolled. */
function rollout(model, rng, firstDice, turns, minFree = 0, nearDone = 0) {
  const m = copyModel(model);
  let gain = 0;
  for (let t = 0; t < turns; t++) {
    const certain = t === 0 && firstDice !== null;
    const dice = certain ? firstDice : Array.from({ length: Math.max(0, E.DICE_PER_PLAYER - m.onCards) }, () => 1 + Math.floor(rng() * 6));
    for (const f of dice) {
      let best = null;
      let bestV = -1;
      for (const c of m.cards) {
        if (!c.alive || c.have[f] >= c.need[f]) continue;
        const missing = c.total - c.placed;
        const freeAfter = E.DICE_PER_PLAYER - m.onCards - 1;
        if (missing > 1 && (freeAfter < 1 || (missing - 1 > nearDone && freeAfter < minFree))) continue; // keep dice free, as the floor says
        const v = (missing === 1 ? 1000 : 0) + (c.points * (certain ? 1 : race(missing, c.rival)) * (c.placed + 1)) / c.total;
        if (v > bestV) { bestV = v; best = c; }
      }
      if (best) {
        gain += put(m, best, f, certain);
        if (certain && m.score >= E.TARGET_SCORE) return gain; // the game is won: nothing after this matters
      }
    }
  }
  // Unfinished cards count for part of their points, more the closer they are, less if a rival is ahead.
  for (const c of m.cards) {
    if (c.alive && c.placed > 0) gain += c.points * race(c.total - c.placed, c.rival) * (c.placed / c.total) ** 2 * 0.5;
  }
  return gain;
}

const average = (fn, seed) => {
  let sum = 0;
  for (let i = 0; i < SIMS; i++) sum += fn(mulberry(seed + i * 7919));
  return sum / SIMS;
};

function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** A number that depends only on the position, so the same position is always judged the same way. */
function seedOf(s) {
  let h = 2166136261;
  const text = JSON.stringify([s.current, s.rolled, s.players.map((p) => p.score), s.cards.map((c) => [c.id, c.placed])]);
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
  return h >>> 0;
}

/** Every legal placement, best first, with the value of ending the turn for comparison. */
function rankMoves(s) {
  const me = s.current;
  const model = snapshot(s, me);
  const seed = seedOf(s);
  const baseline = average((rng) => rollout(model, rng, [], LOOKAHEAD), seed);
  const free = E.handSize(s, me);
  const moves = E.legalMoves(s).map((mv) => {
    const m = copyModel(model);
    // never spend the last free die on a card it does not finish: that leaves nothing to roll next turn
    const c = model.cards[mv.card];
    const allowed = free > 1 || c.placed + 1 === c.total;
    const face = s.rolled[mv.rolled];
    const finishes = m.cards[mv.card].placed + 1 === m.cards[mv.card].total;
    const gainedNow = put(m, m.cards[mv.card], face, true);
    if (m.score >= E.TARGET_SCORE) return { ...mv, allowed, value: gainedNow + 1e-3 }; // a winning card ends the game, and beats any other way of winning
    const rest = s.rolled.filter((_, i) => i !== mv.rolled);
    // On a tie, finish the card first.
    return { ...mv, allowed, value: gainedNow + average((rng) => rollout(m, rng, rest, LOOKAHEAD), seed) + (finishes ? 1e-6 : 0) };
  });
  moves.sort((a, b) => b.value - a.value);
  return { moves, baseline };
}

/** The simple strategy: finish cards when possible, otherwise favour big cards that are nearly done. */
function greedyAction(s, rng, minFree = 0, nearDone = 0) {
  const me = s.current;
  if (s.phase === 'start') {
    const hand = E.handSize(s, me);
    if (hand === 0) return { type: 'takeback' };
    const closest = Math.min(...s.cards.map((c) => (c.placed[me].length ? E.missing(c, me).length : Infinity)));
    return hand <= 2 && closest > 1 && rng() < 0.6 ? { type: 'takeback' } : { type: 'roll' };
  }
  let best = null;
  let bestScore = -Infinity;
  const free = E.handSize(s, me); // dice not on cards, rolled ones included
  for (const m of E.legalMoves(s)) {
    const card = s.cards[m.card];
    const left = E.missing(card, me).length - 1;
    // Spending a die leaves one fewer to roll next turn: don't go below `minFree` unless this finishes the card.
    if (left > 0 && (free - 1 < 1 || (left > nearDone && free - 1 < minFree))) continue; // never spend the last free die on a card that stays unfinished
    const score = card.points / (left + 1) + (left === 0 ? 100 : 0) + rng() * 0.1;
    if (score > bestScore) { bestScore = score; best = m; }
  }
  return best ? { type: 'place', rolled: best.rolled, card: best.card } : { type: 'end' };
}

/**
 * Strengths. `smartTakeBack`: decide Take Back by looking ahead. `smartPlace`: how often a placement decision
 * (where to put a die, or whether to place it at all or keep it to roll again) uses the look-ahead.
 * `minFree`: when not using the look-ahead, don't spend a die that would leave fewer than this many free to roll
 * next turn unless the die finishes the card, or leaves it one die from done (`nearDone`). A die that would
 * leave nothing to roll is never spent on a card it does not finish.
 */
const LEVELS = {
  easy: { smartTakeBack: false, smartPlace: 0, minFree: 1, nearDone: 0 },
  normal: { smartTakeBack: false, smartPlace: 0, minFree: 2, nearDone: 1 }, // sensible rules of thumb, no look-ahead
  hard: { smartTakeBack: true, smartPlace: 1, minFree: 0, nearDone: 0 },
};
const DEFAULT_LEVEL = 'normal';

/** Decide the CPU's next single action for the current state. */
function aiNextAction(s, { level = DEFAULT_LEVEL, rng = Math.random } = {}) {
  const { smartTakeBack, smartPlace, minFree, nearDone } = LEVELS[level] || LEVELS[DEFAULT_LEVEL];
  if (s.phase === 'start') return smartTakeBack ? smartStart(s, minFree, nearDone) : greedyAction(s, rng, minFree, nearDone);
  return smartPlace >= 1 || rng() < smartPlace ? smartPlacing(s) : greedyAction(s, rng, minFree, nearDone);
}

function smartStart(s, minFree = 0, nearDone = 0) {
  const me = s.current;
  {
    const hand = E.handSize(s, me);
    if (hand === 0) return { type: 'takeback' };
    if (hand === E.DICE_PER_PLAYER) return { type: 'roll' };
    // Keep what is on the cards, or take it all back and roll all six: whichever plays out better.
    const keep = snapshot(s, me);
    const reset = copyModel(keep);
    reset.onCards = 0;
    for (const c of reset.cards) { c.have.fill(0); c.placed = 0; }
    const seed = seedOf(s);
    const keepValue = average((rng) => rollout(keep, rng, null, LOOKAHEAD, minFree, nearDone), seed);
    const resetValue = average((rng) => rollout(reset, rng, null, LOOKAHEAD, minFree, nearDone), seed);
    return resetValue > keepValue + 0.5 ? { type: 'takeback' } : { type: 'roll' };
  }
}

function smartPlacing(s) {
  if (!E.legalMoves(s).length) return { type: 'end' };
  const { moves, baseline } = rankMoves(s);
  const best = moves.find((mv) => mv.allowed);
  // Only place a die if doing so beats ending the turn and keeping it to roll again.
  return best && best.value > baseline + 0.05 ? { type: 'place', rolled: best.rolled, card: best.card } : { type: 'end' };
}

/** The best legal placement even when ending the turn would be better (or null if nothing fits). */
function bestPlacement(s) {
  const { moves } = rankMoves(s);
  return moves.length ? { rolled: moves[0].rolled, card: moves[0].card } : null;
}

/** For tools and tests: every legal placement with its value, and the value of ending the turn instead. */
const explain = rankMoves;

// Player look: dice colours and the little drawing used as a player icon.

const PALETTE = [
  { name: 'Red', hex: '#e5484d', pip: '#ffffff' },
  { name: 'Blue', hex: '#3b82f6', pip: '#ffffff' },
  { name: 'Green', hex: '#2fb36d', pip: '#ffffff' },
  { name: 'Yellow', hex: '#f2c230', pip: '#2b2417' },
  { name: 'Purple', hex: '#a855f7', pip: '#ffffff' },
  { name: 'Teal', hex: '#14b8a6', pip: '#ffffff' },
  { name: 'Pink', hex: '#ec4899', pip: '#ffffff' },
  { name: 'Black', hex: '#2a2f3a', pip: '#ffffff' },
];

// Names for computer players, all short enough for a scoreboard chip.
const CPU_NAMES = [
  'Dicey', 'Snake Eyes', 'Lucky', 'Boxcars', 'Rollo', 'Pips', 'Tumbler', 'Cubert', 'Ace', 'Jinx',
  'Gizmo', 'Pixel', 'Turbo', 'Widget', 'Sparky', 'Nova', 'Clank', 'Bolt', 'Dottie', 'Hazard',
  'Wildcard', 'Roulette', 'Domino', 'Shaker', 'Gambit', 'Fortune', 'Chance', 'Roller', 'Sixer', 'Lucky 7',
  'Rolo', 'Bones', 'Pebble', 'Tango', 'Zigzag', 'Maverick', 'Dash', 'Echo', 'Fizz', 'Comet',
];

/** A random computer-player name that nobody at the table already has. */
function cpuName(taken = []) {
  const used = new Set(taken.map((n) => String(n).trim().toLowerCase()));
  const free = CPU_NAMES.filter((n) => !used.has(n.toLowerCase()));
  if (free.length) return free[Math.floor(Math.random() * free.length)];
  for (let i = 2; ; i++) {
    const n = `Robo ${i}`;
    if (!used.has(n.toLowerCase())) return n;
  }
}

/** `wanted` if no one else has it, otherwise the first colour nobody has. */
function freeColor(taken, wanted) {
  const used = new Set(taken);
  if (Number.isInteger(wanted) && wanted >= 0 && wanted < PALETTE.length && !used.has(wanted)) return wanted;
  const free = PALETTE.findIndex((_, i) => !used.has(i));
  return free < 0 ? 0 : free;
}

const AVATAR_PREFIX = 'data:image/png;base64,';
const AVATAR_MAX = 20000; // characters; icons from other players are untrusted input

/** Only our own small PNG icons are ever shown; anything else from the network is dropped. */
function safeAvatar(value) {
  return typeof value === 'string' && value.length <= AVATAR_MAX && value.startsWith(AVATAR_PREFIX) && /^[A-Za-z0-9+/=]+$/.test(value.slice(AVATAR_PREFIX.length))
    ? value
    : '';
}

/* ---- drawing surface (kept off-screen so the editor can be re-rendered without losing the picture) ---- */

// Icons are drawn on opaque paper, so the dice colour only ever appears as the ring around them.
const PAPER = '#fffdf4';
const INK = [PALETTE[7].hex, ...PALETTE.slice(0, 7).map((c) => c.hex)];
const BRUSHES = [8, 14, 22]; // the middle one is the default, thick enough to read on a small scoreboard icon
const STAMPS = ['😀', '😎', '🤠', '🥳', '🐱', '🐶', '🦊', '🐸', '🐼', '🦄', '👑', '🔥'];
const AVATAR_SIZE = 128;
const SIZE = AVATAR_SIZE;

function fillPaper(buf) {
  const ctx = buf.getContext('2d');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, SIZE, SIZE);
}

function makeSketch() {
  const buf = document.createElement('canvas');
  buf.width = SIZE;
  buf.height = SIZE;
  fillPaper(buf);
  return { buf, dirty: false, ink: INK[0], width: BRUSHES[1], erase: false, stamp: null };
}

function paintCanvas(canvas, sketch) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.drawImage(sketch.buf, 0, 0);
}

function pointOn(canvas, event) {
  const r = canvas.getBoundingClientRect();
  return { x: ((event.clientX - r.left) / r.width) * SIZE, y: ((event.clientY - r.top) / r.height) * SIZE };
}

function strokeSegment(sketch, from, to) {
  const ctx = sketch.buf.getContext('2d');
  const ink = sketch.erase ? PAPER : sketch.ink; // erasing paints the paper back
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = ink;
  ctx.lineWidth = sketch.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (from.x === to.x && from.y === to.y) {
    // a tap: some browsers draw nothing for a zero-length line, so paint the dot directly
    ctx.fillStyle = ink;
    ctx.arc(to.x, to.y, sketch.width / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }
  sketch.dirty = true;
}

/** Press an emoji stamp onto the drawing, sized to the current brush. */
function stampAt(sketch, at) {
  const ctx = sketch.buf.getContext('2d');
  const size = sketch.width * 4;
  ctx.globalCompositeOperation = 'source-over';
  ctx.font = `${size}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(sketch.stamp, at.x, at.y + size * 0.05);
  sketch.dirty = true;
}

function clearSketch(sketch) {
  fillPaper(sketch.buf);
  sketch.dirty = false;
}

/** Load a saved icon for editing. Older icons were transparent; those are laid on `legacyBg`. */
function loadAvatar(sketch, dataUrl, done, legacyBg = PAPER) {
  if (!safeAvatar(dataUrl)) return;
  const img = new Image();
  img.onload = () => {
    const ctx = sketch.buf.getContext('2d');
    const probe = document.createElement('canvas');
    probe.width = probe.height = 1;
    probe.getContext('2d').drawImage(img, 0, 0, 1, 1);
    if (probe.getContext('2d').getImageData(0, 0, 1, 1).data[3] < 250) {
      ctx.fillStyle = legacyBg;
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
    ctx.drawImage(img, 0, 0, SIZE, SIZE);
    sketch.dirty = true;
    done();
  };
  img.src = dataUrl;
}

/** The drawing as a small PNG data URL, or '' when nothing was drawn. */
function exportAvatar(sketch) {
  if (!sketch.dirty) return '';
  let url = sketch.buf.toDataURL('image/png');
  if (url.length > AVATAR_MAX) {
    const small = document.createElement('canvas');
    small.width = small.height = 80;
    small.getContext('2d').drawImage(sketch.buf, 0, 0, 80, 80);
    url = small.toDataURL('image/png');
  }
  return safeAvatar(url);
}

// Room transports. Both expose the same small "room store" shape to the game:
//   host(code, {resume}) -> ref     create a room (throws 'taken' if the code is in use)
//   join(code)           -> ref     connect to a room (throws 'notfound')
// and a ref has get(), set(room), acquire(), onSnapshot(next, error), close().
// A snapshot is { exists, data() } where data() is the whole room document.


const PEER_PREFIX = 'rollick-';
const MAX_SEATS = 8;
const keyOf = (code) => `rfi-room-${code}`;

function tryStorage(fn) {
  try { return fn(); } catch { return null; }
}

const cleanName = (n) => (String(n ?? '').trim() || 'Player').slice(0, 12);

function snapshotOf(room) {
  return { id: 'room', exists: room !== null, data: () => room ?? undefined, metadata: {} };
}

/** Rooms kept in the host page's shared database (the claude.ai artifact). */
function dbStore(db) {
  const doc = (code) => db.collection('rooms').doc(code);
  // Wrap the platform's document reference instead of adding to it, which it may not allow.
  const wrap = (ref) => ({
    get: () => ref.get(),
    set: (data) => ref.set(data),
    acquire: (options) => ref.acquire(options),
    onSnapshot: (next, error) => ref.onSnapshot(next, error),
    close() {},
  });
  return {
    kind: 'db',
    async host(code, { resume = false } = {}) {
      const ref = doc(code);
      if (!resume && (await ref.get()).exists) throw new Error('taken');
      return wrap(ref);
    },
    async join(code) {
      const ref = doc(code);
      if (!(await ref.get()).exists) throw new Error('notfound');
      return wrap(ref);
    },
  };
}

// PeerJS ships with a STUN server and a free shared TURN relay; these are repeated here so that your
// own relay (set in config.js as RFI_ICE_SERVERS) is added on top of them rather than replacing them.
// Players on different networks need a relay when their routers block direct links, and mobile networks often
// only let TCP/443 through, so each relay is offered over UDP, TCP and TLS. The public relays are free and
// best effort; a relay of your own (RFI_ICE_SERVERS) is the dependable fix.
const DEFAULT_ICE = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:global.stun.twilio.com:3478'] },
  {
    urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478', 'turn:eu-0.turn.peerjs.com:3478?transport=tcp', 'turn:us-0.turn.peerjs.com:3478?transport=tcp'],
    username: 'peerjs', credential: 'peerjsp',
  },
  {
    urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:80?transport=tcp', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'],
    username: 'openrelayproject', credential: 'openrelayproject',
  },
];

/**
 * Asks this phone's network what it can do: which kinds of connection candidates it can gather.
 * `relay` means a relay server is reachable, which is what links players on different networks.
 */
function checkConnection(extraIce, ms = 7000) {
  return new Promise((resolve) => {
    const found = { host: 0, srflx: 0, relay: 0 };
    let pc;
    try { pc = new RTCPeerConnection({ iceServers: [...DEFAULT_ICE, ...(Array.isArray(extraIce) ? extraIce : [])] }); } catch { resolve(null); return; }
    const done = () => { clearTimeout(timer); try { pc.close(); } catch { /* closed */ } resolve(found); };
    const timer = setTimeout(done, ms);
    pc.onicecandidate = (e) => {
      if (!e.candidate) { done(); return; }
      const type = / typ (\w+)/.exec(e.candidate.candidate)?.[1];
      if (type in found) { found[type]++; if (found.relay) done(); }
    };
    pc.createDataChannel('probe');
    pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(done);
  });
}

function withIce(options, extra) {
  const custom = Array.isArray(extra) ? extra : [];
  return { ...options, config: { ...options?.config, iceServers: options?.config?.iceServers ?? [...DEFAULT_ICE, ...custom] } };
}

/** Small helper: a status value (online / reconnecting / lost) that listeners can follow. */
function statusFeed() {
  const subs = new Set();
  let value = 'online';
  return {
    set(next) { if (next !== value) { value = next; subs.forEach((cb) => cb(value)); } },
    on(cb) { subs.add(cb); cb(value); return () => subs.delete(cb); },
  };
}

/** Rooms held in the host's browser, reached over WebRTC through PeerJS. */
function p2pStore(Peer, options, uid, extraIce) {
  const peerOptions = withIce(options, extraIce);
  // Resolves once the signalling server has accepted us. A blocked or overloaded server can leave this
  // hanging, so give up after a while instead of leaving the screen waiting forever.
  const open = (peer) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(Object.assign(new Error('timeout'), { type: 'timeout' })), 12000);
    peer.on('open', (id) => { clearTimeout(timer); resolve(id); });
    peer.on('error', (e) => { clearTimeout(timer); reject(Object.assign(new Error(e.type), { type: e.type })); });
  });

  return {
    kind: 'p2p',

    async host(code, { resume = false } = {}) {
      let room = resume ? tryStorage(() => JSON.parse(localStorage.getItem(keyOf(code)))) : null;
      if (resume && !room) throw new Error('notfound');
      const peer = new Peer(PEER_PREFIX + code, peerOptions);
      try { await open(peer); } catch (e) { peer.destroy(); throw new Error(e.type === 'unavailable-id' ? 'taken' : 'network'); }

      const subs = new Set();
      const status = statusFeed();
      const conns = new Map(); // peer connection -> player uid
      const broadcast = () => {
        for (const conn of conns.keys()) if (conn.open) conn.send({ t: 'room', room });
        subs.forEach((cb) => cb(snapshotOf(room)));
      };
      const publish = (next) => {
        room = next;
        tryStorage(() => localStorage.setItem(keyOf(code), JSON.stringify(room)));
        broadcast();
      };

      // Guests can only ask to join the lobby, or make the move it is their turn to make.
      const onGuestMessage = (conn, msg) => {
        const sender = conns.get(conn);
        if (!room || !sender) return;
        if (msg.t === 'ping') { conn.send({ t: 'pong' }); return; }
        if (msg.t === 'hello') { conn.send({ t: 'room', room }); return; }
        if (msg.t !== 'set' || !msg.room) return;
        if (room.status === 'lobby') {
          // In the lobby a guest may only add or update their own seat.
          const mine = msg.room.seats?.find((p) => p.uid === sender);
          const at = room.seats.findIndex((p) => p.uid === sender);
          if (mine && at >= 0) {
            const others = room.seats.filter((_, i) => i !== at).map((p) => p.color);
            const look = { name: cleanName(mine.name), color: freeColor(others, mine.color), avatar: safeAvatar(mine.avatar) };
            publish({ ...room, seats: room.seats.map((p, i) => (i === at ? { ...p, ...look } : p)) });
            return;
          }
          if (mine && room.seats.length < MAX_SEATS) {
            const look = { name: cleanName(mine.name), color: freeColor(room.seats.map((p) => p.color), mine.color), avatar: safeAvatar(mine.avatar) };
            publish({ ...room, seats: [...room.seats, { uid: sender, cpu: false, ...look }] });
            return;
          }
        } else if (room.game && msg.room.game) {
          const mover = room.seats[room.game.current]?.uid;
          const g = msg.room.game;
          if (mover === sender && g.gid === room.game.gid && g.rev > room.game.rev) {
            publish({ ...room, game: g, status: g.phase === 'over' ? 'over' : 'playing' });
            return;
          }
        }
        conn.send({ t: 'room', room }); // refused: resync the sender
      };

      peer.on('connection', (conn) => {
        conns.set(conn, conn.metadata?.uid ?? null);
        conn.on('data', (msg) => onGuestMessage(conn, msg));
        conn.on('close', () => conns.delete(conn));
      });

      // A locked or backgrounded phone drops its link to the signalling server; get it back.
      let regain = 0;
      const regainSignal = () => {
        if (peer.destroyed || !peer.disconnected) return;
        status.set('reconnecting');
        try { peer.reconnect(); } catch { /* not ready yet; the timer tries again */ }
        clearTimeout(regain);
        regain = setTimeout(regainSignal, 3000);
      };
      peer.on('disconnected', regainSignal);
      peer.on('open', () => { clearTimeout(regain); status.set('online'); });
      const onVisible = () => { if (!document.hidden) regainSignal(); };
      document.addEventListener('visibilitychange', onVisible);

      return {
        async get() { return snapshotOf(room); },
        async set(next) { publish(JSON.parse(JSON.stringify(next))); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next) { subs.add(next); next(snapshotOf(room)); return () => subs.delete(next); },
        onStatus: status.on,
        retry: regainSignal,
        close() {
          clearTimeout(regain);
          document.removeEventListener('visibilitychange', onVisible);
          for (const conn of conns.keys()) if (conn.open) conn.send({ t: 'bye' }); // so guests leave at once
          tryStorage(() => localStorage.removeItem(keyOf(code)));
          setTimeout(() => peer.destroy(), 250);
        },
      };
    },

    async join(code) {
      const peer = new Peer(undefined, peerOptions);
      try { await open(peer); } catch { peer.destroy(); throw new Error('network'); }

      let room = null; // the last room we were sent; kept while reconnecting
      let fresh = true; // the next room message is the first on a new connection
      let conn = null;
      let closed = false;
      let lastSeen = Date.now();
      const subs = new Set();
      const errors = new Set();
      const status = statusFeed();

      let latest = null; // the newest connection attempt; anything from an older one is ignored
      const connect = () => new Promise((resolve, reject) => {
        const c = peer.connect(PEER_PREFIX + code, { metadata: { uid }, reliable: true });
        latest = c;
        const timer = setTimeout(() => reject(new Error('timeout')), 15000); // slow networks can take a while
        const onPeerError = (e) => { if (e.type === 'peer-unavailable') { clearTimeout(timer); reject(new Error('notfound')); } };
        peer.on('error', onPeerError);
        c.on('open', () => c.send({ t: 'hello' }));
        c.on('data', (msg) => {
          if (c !== latest) return;
          lastSeen = Date.now();
          if (msg.t === 'bye') { closed = true; errors.forEach((cb) => cb({ code: 'closed' })); return; }
          if (msg.t !== 'room') return;
          clearTimeout(timer);
          peer.off('error', onPeerError);
          room = msg.room;
          if (fresh) { fresh = false; conn = c; status.set('online'); resolve(); }
          subs.forEach((cb) => cb(snapshotOf(room)));
        });
        c.on('close', () => { if (!closed && conn === c) reconnect(); });
      });

      // Keeps trying for about two minutes, since the host may only have locked their phone for a moment.
      let retrying = false;
      async function reconnect() {
        if (retrying || closed) return;
        retrying = true;
        status.set('reconnecting');
        for (let i = 0; i < 30 && !closed; i++) {
          await new Promise((r) => setTimeout(r, Math.min(1500 + i * 500, 5000)));
          try {
            if (peer.disconnected) peer.reconnect();
            fresh = true; // the first message after reconnecting replaces our connection
            await connect();
            retrying = false;
            return;
          } catch { /* try again */ }
        }
        retrying = false;
        status.set('lost');
        errors.forEach((cb) => cb({ code: 'lost' }));
      }

      await connect().catch((e) => { peer.destroy(); throw e; });

      // A phone that was backgrounded can keep a dead link open; ping so it is noticed, and recheck on wake-up.
      const beat = setInterval(() => {
        if (closed || retrying || !conn) return;
        if (Date.now() - lastSeen > 25000) { conn.close(); return; }
        if (conn.open) conn.send({ t: 'ping' });
      }, 8000);
      const onVisible = () => {
        if (document.hidden || closed || retrying) return;
        if (!conn?.open || Date.now() - lastSeen > 25000) { try { conn?.close(); } catch { /* already closed */ } reconnect(); }
      };
      document.addEventListener('visibilitychange', onVisible);

      return {
        async get() { return snapshotOf(room); },
        async set(next) {
          if (!conn?.open) throw new Error('offline');
          // A move only needs the game; everything else (seats, icons) is the host's to keep.
          const sent = next.game ? { game: next.game, status: next.status } : next;
          conn.send({ t: 'set', room: JSON.parse(JSON.stringify(sent)) });
        },
        async acquire() { return { acquired: true }; },
        onSnapshot(next, error) { subs.add(next); if (error) errors.add(error); next(snapshotOf(room)); return () => { subs.delete(next); errors.delete(error); }; },
        onStatus: status.on,
        retry: () => { try { conn?.close(); } catch { /* already closed */ } retrying = false; reconnect(); },
        close() { closed = true; clearInterval(beat); document.removeEventListener('visibilitychange', onVisible); peer.destroy(); },
      };
    },
  };
}

function statusText(s) {
  const cur = s.players[s.current];
  const deck = s.deck.length ? ` <small>· ${s.deck.length} cards left</small>` : '';
  if (s.phase === 'over') return wins(s.players[s.winner].name);
  if (ui.rolling) return `${esc(cur.name)} rolls…`;
  if (cur.cpu) return `${esc(cur.name)} is thinking…${deck}`;
  if (ui.online && s.current !== net.mySeat) return (net.mySeat < 0 ? `Watching ${esc(cur.name)}…` : `${esc(cur.name)} is playing…`) + deck;
  if (s.phase === 'start') {
    return (E.handSize(s, s.current) === 0 ? 'All your dice are on cards. Take them back.' : `${esc(cur.name)}: roll your ${E.handSize(s, s.current)} dice`) + deck;
  }
  if (!s.rolled.length) return 'All dice placed';
  if (!E.legalMoves(s).length) return 'No matches this time';
  return ui.selected === null ? 'Tap a die, then the card it fits' : 'Tap a highlighted card';
}

/** A staggered pile of the cards a player has claimed, with their points showing. */
function pileHtml(pile = []) {
  if (!pile.length) return '<span class="pile blank" aria-hidden="true"></span>';
  const shown = pile.slice(-6);
  const more = pile.length - shown.length;
  return `<span class="pile" aria-label="${pile.length} cards claimed">${more ? `<em>+${more}</em>` : ''}${shown.map((pts, k) => `<i data-tier="${tierOf(pts)}" style="--n:${k}">${pts}</i>`).join('')}</span>`;
}

const tierOf = (points) => (points >= 13 ? 4 : points >= 9 ? 3 : points >= 5 ? 2 : 1);

/** A die on a card takes the colour of whoever covers it; several players split it into slices. */
const ownedClass = (owners) => (owners.length === 0 ? 'ghost' : owners.length === 1 ? 'owned' : 'owned shared');
function ownedStyle(owners, s) {
  if (!owners.length) return '';
  const seat = (p) => swatch(seats()[p], p);
  if (owners.length === 1) return `--c:${seat(owners[0]).hex};--pc:${seat(owners[0]).pip}`;
  const shown = owners.slice(0, 4); // a die is only so big
  const step = 100 / shown.length;
  const slices = shown.map((p, k) => `${seat(p).hex} ${(k * step).toFixed(1)}% ${((k + 1) * step).toFixed(1)}%`).join(', ');
  return `--c:${seat(shown[0]).hex};--bg:conic-gradient(${slices});--pc:#fff`;
}

/** For each die a card needs, the players covering it, in seat order. */
function slotOwners(s, card) {
  const used = new Map(); // per player, how many of each face already counted
  return card.need.map((face) => s.players.map((_, p) => p).filter((p) => {
    const key = `${p}:${face}`;
    const c = used.get(key) || 0;
    const has = card.placed[p].filter((f) => f === face).length;
    used.set(key, c + 1);
    return has > c;
  }));
}

const nameList = (s, ps) => ps.map((p) => s.players[p].name).join(', ');

function cardView(s, card, ci) {
  const accepts = ui.selected !== null && E.canPlace(s, ui.selected, ci);
  const n = card.need.length;
  // [dice per row, die size in % of card width]; sized so the block fits between the two corner numbers.
  const [cols, dz] = { 1: [1, 50], 2: [2, 40], 3: [3, 26], 4: [2, 40], 5: [3, 26] }[n] || [3, 24];
  const per = slotOwners(s, card);
  const slots = card.need.map((face, si) => {
    const owners = per[si];
    const peeked = ui.peek && ui.peek.card === ci && ui.peek.slot === si ? ' peeked' : '';
    const who = owners.length ? `covered by ${nameList(s, owners)}` : 'not covered yet';
    const badge = owners.length > 1 ? `<span class="badge" aria-hidden="true">${owners.length}</span>` : '';
    return `<button type="button" class="slot${peeked}" data-act="peek" data-card="${ci}" data-slot="${si}" data-o="${owners.length}" aria-label="Die ${face}, ${esc(who)}">
      <span class="dwrap">${die(face, ownedClass(owners), `style="${ownedStyle(owners, s)}"`)}${badge}</span></button>`;
  }).join('');
  return `<div class="gcard ${accepts ? 'accepts' : ''} ${ui.hint?.card === ci ? 'hinted' : ''}" data-tier="${tierOf(card.points)}" data-act="pickCard" data-card="${ci}" role="group" aria-label="${card.points} point card">
    <div class="corner tl"><b>${card.points}</b></div>
    <div class="face" style="--fc:${cols};--dz:${dz}">${slots}</div>
    <div class="corner br"><b>${card.points}</b></div>
  </div>`;
}

function gameView() {
  const s = ui.game;
  const human = isMine(s);
  const mine = seats()[s.current];
  const chips = s.players.map((p, i) => `
    <div class="chip ${i === s.current && s.phase !== 'over' ? 'active' : ''}" data-p="${i}" style="--c:${hexOf(i)}">
      ${avatarHtml(seats()[i], i, 28)}
      <span class="meta"><span class="n">${esc(p.name)}${ui.online && i === net.mySeat ? ' (you)' : ''}</span><span class="s"><b class="num">${p.score}</b><small> / ${E.TARGET_SCORE}</small></span></span>
      ${pileHtml(p.pile)}
    </div>`).join('');

  let tray;
  let live = 0; // dice shown in the tray; the rest of the six are on cards
  if (s.phase === 'placing') {
    tray = s.rolled.map((f, i) => {
      const fx = ui.fx[i] || { delay: 0, dur: 0, dx: 0, rot: 0 };
      const spinning = ui.rolling && fx.dur > 0;
      const style = `${diceVars(mine, s.current)};--d:${fx.delay}ms;--dur:${fx.dur}ms;--dx:${fx.dx}px;--rot:${fx.rot}deg`;
      const face = spinning ? 1 + Math.floor(Math.random() * 6) : f;
      return die(face, `owned ${spinning ? 'rolling' : ''} ${ui.selected === i ? 'sel' : ''} ${ui.hint?.rolled === i ? 'hinted' : ''}`,
        `style="${style}" data-i="${i}" ${human && !ui.rolling ? `data-act="pickRolled"` : 'disabled'}`, 'button');
    }).join('');
    live = s.rolled.length;
  } else {
    live = E.handSize(s, s.current);
    tray = Array.from({ length: live }, () => die(1, 'owned hand', `style="${diceVars(mine, s.current)}"`)).join('').replace(/aria-label="1"/g, 'aria-label="die in hand"');
  }
  // Always six places, so the tray (and with it the whole table) never changes height from turn to turn.
  tray += Array.from({ length: Math.max(0, E.DICE_PER_PLAYER - live) }, () => `<div class="die empty" aria-label="die on a card">${'<i></i>'.repeat(9)}</div>`).join('');
  const onCards = E.DICE_PER_PLAYER - E.handSize(s, s.current);
  const canTakeBack = human && s.phase === 'start' && onCards > 0;
  const mustTakeBack = canTakeBack && onCards === E.DICE_PER_PLAYER;
  const canRoll = human && s.phase === 'start' && E.handSize(s, s.current) > 0;
  const canEnd = human && s.phase === 'placing' && !ui.rolling;
  const noMoves = canEnd && !E.legalMoves(s).length;

  return `
    <div class="game">
    <div class="table">
    <div class="score" data-rows="${Math.ceil(s.players.length / 4) > 1 ? 2 : 1}" style="--per:${Math.ceil(s.players.length / Math.ceil(s.players.length / 4))}">${chips}</div>
    <div class="status"><span>${statusText(s)}</span></div>
    <div class="cards"><div class="cardgrid" data-n="${s.cards.length}">${s.cards.map((c, i) => cardView(s, c, i)).join('')}<div class="deckback" aria-hidden="true"><b>${s.deck.length}</b><span>left</span></div></div></div>
    </div>
    <div class="tray">
      <div class="dice">${tray}</div>
      <div class="actions">
        ${s.phase === 'start' ? `
          <button class="btn primary ${canRoll ? 'pulse' : ''} ${ui.hint?.button === 'roll' ? 'hinted' : ''}" data-act="roll" ${canRoll ? '' : 'disabled'}>Roll</button>
          <button class="btn ${mustTakeBack ? 'primary pulse' : ''} ${ui.hint?.button === 'takeback' ? 'hinted' : ''}" data-act="takeBack" ${canTakeBack ? '' : 'disabled'} aria-label="Take back all your dice and roll all six">Take back<small>&amp; roll all</small></button>`
          : `<button class="btn ${noMoves ? 'primary pulse' : ''}" data-act="end" ${canEnd ? '' : 'disabled'}>End turn</button>
          ${human && ui.undo.length ? '<button class="btn icon" data-act="undo" aria-label="Undo last placement" title="Undo">↶</button>' : ''}`}
        <button class="btn icon" data-act="hint" aria-label="Hint" title="Hint" ${human && !ui.rolling ? '' : 'disabled'}>💡</button>
        <button class="btn icon" data-act="menu" aria-label="Menu">☰</button>
      </div>
    </div>
    </div>`;
}

/** Who covers the tapped die, and how far along each player is on this card. It follows the live game. */
function peekView() {
  const pk = ui.peek;
  const s = ui.game;
  const card = pk && s?.cards[pk.card];
  if (!card || card.id !== pk.id) { ui.peek = null; return ''; } // the card was claimed or replaced
  const owners = slotOwners(s, card)[pk.slot] || [];
  const face = card.need[pk.slot];
  const row = (p, extra = '') => `<div class="orow">${avatarHtml(seats()[p], p, 26)}<span>${esc(s.players[p].name)}${ui.online && p === net.mySeat ? ' <small>(you)</small>' : ''}</span>${extra}</div>`;
  const who = owners.length ? owners.map((p) => row(p)).join('') : '<div class="none">Nobody has this die yet.</div>';
  const total = card.need.length;
  const progress = s.players.map((pl, p) => ({ p, n: card.placed[p].length })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const sum = progress.length
    ? `<div class="sum"><div class="sumh">On this card</div>${progress.map((x) => row(x.p, `<b>${x.n}/${total}</b>`)).join('')}</div>`
    : '';
  return `<div class="peek" role="dialog" aria-label="Who has this die">
    <h3>${die(face, 'ghost', 'style="--size:22px"')}<span>${card.points}-point card</span></h3>${who}${sum}</div>`;
}

/** Anchor the popover under (or above) the die it is about, wherever the layout has put it. */
function positionPeek() {
  const pop = app.querySelector('.peek');
  const slot = ui.peek && app.querySelector(`.slot[data-card="${ui.peek.card}"][data-slot="${ui.peek.slot}"]`);
  if (!pop || !slot) return;
  const r = slot.getBoundingClientRect();
  const width = Math.min(260, window.innerWidth - 16);
  const left = Math.max(8, Math.min(window.innerWidth - width - 8, r.left + r.width / 2 - width / 2));
  const room = window.innerHeight - (r.bottom + 8);
  pop.style.width = `${width}px`;
  pop.style.left = `${left}px`;
  if (room >= pop.offsetHeight || room >= r.top - 8) pop.style.top = `${r.bottom + 8}px`;
  else { pop.style.top = `${r.top - 8}px`; pop.style.transform = 'translateY(-100%)'; }
}

function editorView() {
  const ed = ui.ed;
  const taken = new Set(editorTaken());
  const ink = INK.map((hex) => `<button class="ink ${!ed.sk.erase && !ed.sk.stamp && ed.sk.ink === hex ? 'on' : ''}" style="--c:${hex}" data-act="ink" data-c="${hex}" aria-label="Ink ${hex}"></button>`).join('')
    + `<button class="ink eraser ${ed.sk.erase ? 'on' : ''}" data-act="eraser" aria-label="Eraser">⌫</button>`;
  const brushes = BRUSHES.map((w) => `<button class="brush ${ed.sk.width === w ? 'on' : ''}" data-act="brush" data-w="${w}" aria-label="Brush size ${w}"><i style="--w:${w}px"></i></button>`).join('');
  const stamps = STAMPS.map((g) => `<button class="stamp ${ed.sk.stamp === g ? 'on' : ''}" data-act="stamp" data-g="${g}" aria-label="Stamp ${g}">${g}</button>`).join('');
  const colors = PALETTE.map((c, i) => `<button class="swatch ${ed.color === i ? 'on' : ''}" style="--c:${c.hex}" data-act="pickColor" data-i="${i}" ${taken.has(i) ? 'disabled' : ''} aria-label="${c.name} dice${taken.has(i) ? ' (taken)' : ''}"></button>`).join('');
  return `<div class="modal"><div class="sheet editor"><h2>Your player</h2>
    <p class="note">Draw your icon with your finger. Your dice colour becomes its ring.</p>
    <div class="avwrap"><canvas id="avcv" width="${AVATAR_SIZE}" height="${AVATAR_SIZE}" aria-label="Drawing area"></canvas></div>
    <div class="tools">${ink}</div>
    <div class="tools"><span class="brushes">${brushes}</span><button class="btn small" data-act="clearArt">Clear</button></div>
    <p class="note">Or press a stamp. The size buttons change stamps too.</p>
    <div class="tools stamps">${stamps}</div>
    <p class="note">Dice colour. Each player needs a different one.</p>
    <div class="tools">${colors}</div>
    <div class="row2"><button class="btn" data-act="closeEditor">Cancel</button><button class="btn primary" data-act="saveEditor">Save</button></div>
  </div></div>`;
}
