<title>Roll for It</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { color-scheme: dark; }
:root {
  --felt: #0f3d2e;
  --felt-2: #14513d;
  --ink: #f6f1e1;
  --muted: #a9c4b8;
  --card: #fff8e7;
  --card-ink: #2b2417;
  --p0: #e5484d; --p1: #3b82f6; --p2: #2fb36d; --p3: #f5a524;
  --radius: 16px;
  /* dice scale with the screen: width on phones, height when it is short (landscape, folded) */
  --cd: clamp(30px, min(10.5vw, 5.8dvh), 56px);
  --td: clamp(38px, min(13vw, 7dvh), 68px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 50% 0%, var(--felt-2), var(--felt));
  color: var(--ink);
  font: clamp(14px, 1.1vw + 10.5px, 18px)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
}
#app {
  min-height: 100dvh; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
}
@media (min-width: 700px) { #app { max-width: 720px; } }
button { font: inherit; color: inherit; cursor: pointer; }
h1 { font-size: 2.4rem; margin: 0; letter-spacing: -.02em; }

.btn {
  border: 0; border-radius: 14px; padding: 14px 20px; font-weight: 700;
  background: #ffffff1f; min-height: 48px;
}
.btn.primary { background: #ffd34d; color: #3a2a00; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pulse:not(:disabled) { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px #ffd34d44; } }

/* setup */
.setup { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.setup .tag { color: var(--muted); margin: 0 0 8px; }
.prow { display: flex; gap: 8px; align-items: center; }
.prow .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.prow input {
  flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 0;
  background: #ffffff1f; color: var(--ink); font: inherit;
}
.prow .btn { padding: 10px 12px; min-height: 44px; }

/* scoreboard */
.score { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  flex: 1 1 calc(100% / var(--per, 4) - 8px); min-width: 0; padding: 8px 10px; border-radius: 12px; background: #00000030;
  border: 2px solid transparent; display: flex; flex-direction: column;
}
.chip.active { border-color: var(--c); background: #00000055; }
.chip .n { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .n::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.chip .s { font-size: 1.4rem; font-weight: 800; }
.chip .s small { font-size: .75rem; color: var(--muted); font-weight: 600; }

.status { text-align: center; min-height: 1.4em; font-weight: 600; }

/* cards */
.cards { display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 0; }
.gcard {
  background: var(--card); color: var(--card-ink); border-radius: var(--radius);
  padding: 10px 14px; display: flex; align-items: center; gap: 12px;
  border: 3px solid transparent; transition: transform .15s;
  width: 100%; text-align: left;
}
.gcard.accepts { border-color: #ffd34d; transform: scale(1.02); box-shadow: 0 0 0 4px #ffd34d55; }
.gcard .pts { font-size: clamp(1.4rem, 5.5dvh, 2.2rem); font-weight: 900; min-width: 2.4ch; text-align: center; line-height: 1; }
.gcard .pts small { display: block; font-size: .6rem; letter-spacing: .1em; color: #8a7a55; }
.slots { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; }
.slot .dots { display: flex; gap: 3px; height: 8px; }
.slot .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

/* dice */
.die {
  --size: var(--cd); --bg: #fff; --pip: #222;
  width: var(--size); height: var(--size); border-radius: calc(var(--size) * .22);
  background: var(--bg); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: calc(var(--size) * .14); box-shadow: inset 0 -3px 0 #0003, 0 2px 4px #0003;
  flex: none;
}
.die i { border-radius: 50%; margin: 12%; }
.die i.on { background: var(--pip); }
.die.ghost { --bg: #e8dfc4; --pip: #8a7a55; box-shadow: inset 0 0 0 2px #c9bc96; }
.die.mine { --bg: var(--c); --pip: #fff; }

/* tray */
.tray { background: #00000030; border-radius: var(--radius); padding: 12px; }
.dice { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: var(--td); align-items: center; }
.dice .die { --size: var(--td); }
.dice button.die { border: 0; }
.dice button.die.sel { outline: 4px solid #ffd34d; outline-offset: 2px; }
.dice .die.rolling { animation: tumble .65s ease-out; }
@keyframes tumble {
  0% { transform: translateY(-40px) rotate(-300deg) scale(.6); opacity: 0; }
  70% { transform: translateY(4px) rotate(20deg); opacity: 1; }
  100% { transform: none; }
}
.dice .hint { color: var(--muted); }
.actions { display: flex; gap: 10px; margin-top: 10px; }
.actions .btn { flex: 1; }

/* overlays */
.toast {
  position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%);
  background: #000d; padding: 10px 16px; border-radius: 999px; font-weight: 700;
  max-width: 90vw; text-align: center; pointer-events: none;
}
.modal {
  position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.sheet {
  background: var(--card); color: var(--card-ink); border-radius: 20px; padding: 20px;
  max-width: 460px; width: 100%; max-height: 85vh; overflow: auto;
}
.sheet h2 { margin-top: 0; }
.sheet ol, .sheet ul { padding-left: 1.2em; }
.sheet .btn { background: #0001; width: 100%; margin-top: 8px; }
.sheet .btn.primary { background: #ffd34d; }
.winner { text-align: center; }
.winner .big { font-size: 2.2rem; font-weight: 900; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

.code { color: #ffd34d; letter-spacing: .15em; }
.setup small { color: var(--muted); font-size: .75rem; }

/* ---- game layout: one column on portrait phones ---- */
.game {
  flex: 1; display: grid; gap: 10px; min-height: 0;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(min-content, 1fr) auto;
  grid-template-areas: "score" "status" "cards" "tray";
}
.table { display: contents; }
.score { grid-area: score; }
.status { grid-area: status; }
.cards { grid-area: cards; }
.tray { grid-area: tray; }
.modal { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* ---- landscape phones, tablets, unfolded foldables: cards left, controls right ---- */
@media (orientation: landscape) and (min-width: 600px) {
  #app { max-width: 1000px; }
  .game {
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "cards score" "cards status" "cards tray";
    column-gap: 16px;
  }
  .tray { align-self: end; }
  .cards { justify-content: flex-start; }
}

/* ---- dual-screen, side by side (Surface Duo open like a book): one screen each side of the hinge ---- */
@media (horizontal-viewport-segments: 2) {
  #app { max-width: none; padding-inline: 0; }
  .game {
    grid-template-columns: env(viewport-segment-width 0 0, 1fr) env(viewport-segment-width 1 0, 1fr);
    column-gap: calc(env(viewport-segment-left 1 0, 0px) - env(viewport-segment-right 0 0, 0px));
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "cards score" "cards status" "cards tray";
  }
  .cards, .score, .status, .tray { margin-inline: 16px; }
  .setup { max-width: env(viewport-segment-width 0 0, 560px); padding-inline: 16px; }
}

/* ---- dual-screen, top and bottom (Surface Duo in laptop posture): table above the hinge, dice below ---- */
@media (vertical-viewport-segments: 2) {
  #app { max-width: none; padding: 0; }
  .game {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: env(viewport-segment-height 0 0, 1fr) env(viewport-segment-height 0 1, 1fr);
    row-gap: calc(env(viewport-segment-top 0 1, 0px) - env(viewport-segment-bottom 0 0, 0px));
    grid-template-areas: "table" "tray";
  }
  .table { display: flex; flex-direction: column; gap: 10px; grid-area: table; min-height: 0; padding: 12px 16px; }
  .tray { align-self: center; width: min(560px, calc(100% - 32px)); }
}

/* ---- very small screens ---- */
@media (max-height: 640px) { .game { gap: 6px; } .cards { gap: 6px; } .gcard { padding: 5px 12px; } .slot { gap: 2px; } .status { min-height: 0; } .score { gap: 6px; } .chip { padding: 5px 8px; } .chip .s { font-size: 1.1rem; } .tray { padding: 8px; } .btn { min-height: 44px; padding: 10px 14px; } }

body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { padding-inline: 0; }
</style>
<div id="app"></div>
<script>
const E = (() => {
// Pure game rules for Roll for It. No DOM access; every transition returns a new state.

const DICE_PER_PLAYER = 6;
const TARGET_SCORE = 40;
const MAX_PLAYERS = 8; // one set plays 2-4; two sets play up to 8

// One 30-card set: [dice required, distinct faces among them, points, how many].
// Harder combinations are worth more, spanning the 2-15 point range.
const SET_SHAPES = [
  [1, 1, 2, 4],
  [2, 2, 5, 6],
  [2, 1, 7, 4],
  [3, 3, 10, 6],
  [3, 2, 12, 6],
  [3, 1, 15, 4],
];

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function multisets(size, min = 1) {
  if (size === 0) return [[]];
  const out = [];
  for (let f = min; f <= 6; f++) {
    for (const rest of multisets(size - 1, f)) out.push([f, ...rest]);
  }
  return out;
}

function buildDeck(rng, sets = 1) {
  const deck = [];
  for (let s = 0; s < sets; s++) {
    for (const [size, distinct, points, count] of SET_SHAPES) {
      const pool = multisets(size).filter((m) => new Set(m).size === distinct);
      for (const need of shuffle(pool, rng).slice(0, count)) deck.push({ points, need });
    }
  }
  return shuffle(deck, rng);
}

const cardsInPlay = (playerCount) => (playerCount >= 5 ? 4 : 3);

/** The faces `player` still needs on `card`. */
function missing(card, player) {
  const left = [...card.need];
  for (const f of card.placed[player]) {
    const i = left.indexOf(f);
    if (i >= 0) left.splice(i, 1);
  }
  return left;
}

function handSize(state, player) {
  const onCards = state.cards.reduce((n, c) => n + c.placed[player].length, 0);
  return DICE_PER_PLAYER - onCards;
}

/** Everyone rolls two dice; highest total goes first, ties roll again. */
function rollOff(count, rng) {
  let contenders = Array.from({ length: count }, (_, i) => i);
  let rolls = [];
  while (contenders.length > 1) {
    rolls = contenders.map((i) => ({ i, total: 2 + Math.floor(rng() * 6) + Math.floor(rng() * 6) }));
    const top = Math.max(...rolls.map((r) => r.total));
    contenders = rolls.filter((r) => r.total === top).map((r) => r.i);
  }
  return { first: contenders[0], total: rolls.length ? rolls.find((r) => r.i === contenders[0]).total : 0 };
}

function newGame(configs, rng = Math.random) {
  if (configs.length < 2 || configs.length > MAX_PLAYERS) throw new Error('2-8 players');
  const players = configs.map((c) => ({ name: c.name, cpu: !!c.cpu, score: 0 }));
  const { first, total } = rollOff(players.length, rng);
  const state = {
    players,
    deck: buildDeck(rng, players.length > 4 ? 2 : 1),
    cards: [],
    current: first,
    firstRoll: total,
    phase: 'start', // start -> placing -> (next player's) start ... -> over
    rolled: [],
    winner: null,
    lastClaim: null,
    nextId: 1,
  };
  for (let i = 0; i < cardsInPlay(players.length); i++) draw(state);
  return state;
}

function draw(state) {
  const base = state.deck.shift();
  if (!base) return false;
  state.cards.push({
    id: state.nextId++,
    points: base.points,
    need: base.need,
    placed: state.players.map(() => []),
  });
  return true;
}

function assertPhase(state, phase) {
  if (state.phase !== phase) throw new Error(`Expected phase ${phase}, got ${state.phase}`);
}

/** Take Back: before rolling, return ALL of your dice from the trays to your hand. */
function takeBack(state) {
  assertPhase(state, 'start');
  const s = structuredClone(state);
  s.lastClaim = null;
  for (const c of s.cards) c.placed[s.current] = [];
  return s;
}

function roll(state, rng = Math.random) {
  assertPhase(state, 'start');
  const n = handSize(state, state.current);
  if (n <= 0) throw new Error('No dice in hand; take them back first');
  const s = structuredClone(state);
  s.lastClaim = null;
  s.rolled = Array.from({ length: n }, () => 1 + Math.floor(rng() * 6));
  s.phase = 'placing';
  return s;
}

function canPlace(state, rolledIdx, cardIdx) {
  if (state.phase !== 'placing') return false;
  const face = state.rolled[rolledIdx];
  const card = state.cards[cardIdx];
  return face !== undefined && !!card && missing(card, state.current).includes(face);
}

function legalMoves(state) {
  const moves = [];
  if (state.phase !== 'placing') return moves;
  state.rolled.forEach((_, r) => {
    state.cards.forEach((_, c) => {
      if (canPlace(state, r, c)) moves.push({ rolled: r, card: c });
    });
  });
  return moves;
}

function place(state, rolledIdx, cardIdx) {
  if (!canPlace(state, rolledIdx, cardIdx)) throw new Error('Illegal placement');
  const s = structuredClone(state);
  s.lastClaim = null;
  const p = s.current;
  const card = s.cards[cardIdx];
  card.placed[p].push(s.rolled[rolledIdx]);
  s.rolled.splice(rolledIdx, 1);

  if (missing(card, p).length === 0) {
    s.players[p].score += card.points;
    s.lastClaim = { player: p, points: card.points, need: card.need };
    // Every player's dice on the claimed card go back to their hands.
    s.cards.splice(cardIdx, 1);
    draw(s);
    if (s.players[p].score >= TARGET_SCORE) {
      s.phase = 'over';
      s.winner = p;
    } else if (s.cards.length === 0) {
      s.phase = 'over';
      s.winner = s.players.reduce((best, pl, i) => (pl.score > s.players[best].score ? i : best), 0);
    }
  }
  return s;
}

/** Leftover rolled dice return to hand; play passes on. */
function endTurn(state) {
  assertPhase(state, 'placing');
  const s = structuredClone(state);
  s.lastClaim = null;
  s.rolled = [];
  s.current = (s.current + 1) % s.players.length;
  s.phase = 'start';
  return s;
}

return { DICE_PER_PLAYER, TARGET_SCORE, MAX_PLAYERS, mulberry32, buildDeck, cardsInPlay, missing, handSize, newGame, takeBack, roll, canPlace, legalMoves, place, endTurn };
})();


/** Decide the CPU's next single action for the current state. */
function aiNextAction(s, rng = Math.random) {
  const me = s.current;

  if (s.phase === 'start') {
    const hand = E.handSize(s, me);
    if (hand === 0) return { type: 'takeback' };
    // Take Back resets everything, so only do it when stuck with few dice and no card nearly done.
    const closest = Math.min(...s.cards.map((c) => (c.placed[me].length ? E.missing(c, me).length : Infinity)));
    if (hand <= 2 && closest > 1 && rng() < 0.6) return { type: 'takeback' };
    return { type: 'roll' };
  }

  const moves = E.legalMoves(s);
  if (!moves.length) return { type: 'end' };
  let best = moves[0];
  let bestScore = -Infinity;
  for (const m of moves) {
    const card = s.cards[m.card];
    const left = E.missing(card, me).length - 1;
    const score = card.points / (left + 1) + (left === 0 ? 100 : 0) + rng() * 0.1;
    if (score > bestScore) {
      bestScore = score;
      best = m;
    }
  }
  return { type: 'place', rolled: best.rolled, card: best.card };
}

// Room transports. Both expose the same small "room store" shape to the game:
//   host(code, {resume}) -> ref     create a room (throws 'taken' if the code is in use)
//   join(code)           -> ref     connect to a room (throws 'notfound')
// and a ref has get(), set(room), acquire(), onSnapshot(next, error), close().
// A snapshot is { exists, data() } where data() is the whole room document.

const PEER_PREFIX = 'rollforit-';
const MAX_SEATS = 8;
const keyOf = (code) => `rfi-room-${code}`;

function tryStorage(fn) {
  try { return fn(); } catch { return null; }
}

function snapshotOf(room) {
  return { id: 'room', exists: room !== null, data: () => room ?? undefined, metadata: {} };
}

/** Rooms kept in the host page's shared database (the claude.ai artifact). */
function dbStore(db) {
  const doc = (code) => db.collection('rooms').doc(code);
  return {
    kind: 'db',
    async host(code, { resume = false } = {}) {
      const ref = doc(code);
      if (!resume && (await ref.get()).exists) throw new Error('taken');
      return Object.assign(ref, { close() {} });
    },
    async join(code) {
      const ref = doc(code);
      if (!(await ref.get()).exists) throw new Error('notfound');
      return Object.assign(ref, { close() {} });
    },
  };
}

/** Rooms held in the host's browser, reached over WebRTC through PeerJS. */
function p2pStore(Peer, options, uid) {
  const open = (peer) => new Promise((resolve, reject) => {
    peer.on('open', resolve);
    peer.on('error', (e) => reject(Object.assign(new Error(e.type), { type: e.type })));
  });

  return {
    kind: 'p2p',

    async host(code, { resume = false } = {}) {
      let room = resume ? tryStorage(() => JSON.parse(localStorage.getItem(keyOf(code)))) : null;
      if (resume && !room) throw new Error('notfound');
      const peer = new Peer(PEER_PREFIX + code, options);
      try { await open(peer); } catch (e) { peer.destroy(); throw new Error(e.type === 'unavailable-id' ? 'taken' : 'network'); }

      const subs = new Set();
      const conns = new Map(); // peer connection -> player uid
      const broadcast = () => {
        for (const conn of conns.keys()) if (conn.open) conn.send({ t: 'room', room });
        subs.forEach((cb) => cb(snapshotOf(room)));
      };
      const publish = (next) => {
        room = next;
        tryStorage(() => localStorage.setItem(keyOf(code), JSON.stringify(room)));
        broadcast();
      };

      // Guests can only ask to join the lobby, or make the move it is their turn to make.
      const onGuestMessage = (conn, msg) => {
        const sender = conns.get(conn);
        if (!room || !sender) return;
        if (msg.t === 'hello') { conn.send({ t: 'room', room }); return; }
        if (msg.t !== 'set' || !msg.room) return;
        if (room.status === 'lobby') {
          const mine = msg.room.seats?.find((p) => p.uid === sender);
          if (mine && !room.seats.some((p) => p.uid === sender) && room.seats.length < MAX_SEATS) {
            publish({ ...room, seats: [...room.seats, { uid: sender, name: String(mine.name).slice(0, 12), cpu: false }] });
            return;
          }
        } else if (room.game && msg.room.game) {
          const mover = room.seats[room.game.current]?.uid;
          const g = msg.room.game;
          if (mover === sender && g.gid === room.game.gid && g.rev > room.game.rev) {
            publish({ ...room, game: g, status: g.phase === 'over' ? 'over' : 'playing' });
            return;
          }
        }
        conn.send({ t: 'room', room }); // refused: resync the sender
      };

      peer.on('connection', (conn) => {
        conns.set(conn, conn.metadata?.uid ?? null);
        conn.on('data', (msg) => onGuestMessage(conn, msg));
        conn.on('close', () => conns.delete(conn));
      });
      peer.on('disconnected', () => peer.reconnect());

      return {
        async get() { return snapshotOf(room); },
        async set(next) { publish(JSON.parse(JSON.stringify(next))); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next) { subs.add(next); next(snapshotOf(room)); return () => subs.delete(next); },
        close() { peer.destroy(); },
      };
    },

    async join(code) {
      const peer = new Peer(undefined, options);
      try { await open(peer); } catch { peer.destroy(); throw new Error('network'); }

      let room = null;
      let conn = null;
      let closed = false;
      const subs = new Set();
      const errors = new Set();

      const connect = () => new Promise((resolve, reject) => {
        const c = peer.connect(PEER_PREFIX + code, { metadata: { uid }, reliable: true });
        const timer = setTimeout(() => reject(new Error('notfound')), 8000);
        const onPeerError = (e) => { if (e.type === 'peer-unavailable') { clearTimeout(timer); reject(new Error('notfound')); } };
        peer.on('error', onPeerError);
        c.on('open', () => c.send({ t: 'hello' }));
        c.on('data', (msg) => {
          if (msg.t !== 'room') return;
          clearTimeout(timer);
          peer.off('error', onPeerError);
          const first = room === null;
          room = msg.room;
          if (first) { conn = c; resolve(); }
          subs.forEach((cb) => cb(snapshotOf(room)));
        });
        c.on('close', () => { if (!closed && conn === c) reconnect(); });
      });

      let retrying = false;
      async function reconnect() {
        if (retrying) return;
        retrying = true;
        for (let i = 0; i < 8 && !closed; i++) {
          await new Promise((r) => setTimeout(r, 1500));
          try {
            if (peer.disconnected) peer.reconnect();
            room = null; // so the first message after reconnecting is treated as fresh
            await connect();
            retrying = false;
            return;
          } catch { /* try again */ }
        }
        retrying = false;
        errors.forEach((cb) => cb({ code: 'lost' }));
      }

      await connect().catch((e) => { peer.destroy(); throw e; });

      return {
        async get() { return snapshotOf(room); },
        async set(next) { if (conn?.open) conn.send({ t: 'set', room: JSON.parse(JSON.stringify(next)) }); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next, error) { subs.add(next); if (error) errors.add(error); next(snapshotOf(room)); return () => { subs.delete(next); errors.delete(error); }; },
        close() { closed = true; peer.destroy(); },
      };
    },
  };
}





const COLORS = ['#e5484d', '#3b82f6', '#2fb36d', '#f5a524', '#a855f7', '#14b8a6', '#ec4899', '#cbd5e1'];
const MAX_PLAYERS = E.MAX_PLAYERS;
const CPU_DELAY = 700;
const ROLL_MS = 650;
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

const app = document.getElementById('app');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};

// Online play: the host page's shared database when present, otherwise peer-to-peer.

const ui = {
  screen: 'setup', // setup | online | lobby | game
  online: false,
  name: store.get('rfi-name') || 'Player',
  joinCode: '',
  setup: [{ name: 'You', cpu: false }, { name: 'Robo', cpu: true }],
  game: null,
  selected: null,
  rolling: false,
  toast: '',
  modal: null,
};
let timer = 0;
let toastTimer = 0;

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wins = (name) => `${esc(name)} ${name.trim().toLowerCase() === 'you' ? 'win' : 'wins'}!`;
const isHost = () => net.room?.hostUid === net.uid;
const color = (p) => COLORS[p % COLORS.length];

function die(face, cls = '', attrs = '', tag = 'div') {
  const pips = Array.from({ length: 9 }, (_, i) => `<i${PIPS[face].includes(i) ? ' class="on"' : ''}></i>`).join('');

}

function statusText(s) {
  const cur = s.players[s.current];
  if (s.phase === 'over') return wins(s.players[s.winner].name);
  if (ui.rolling) return `${esc(cur.name)} rolls…`;
  if (cur.cpu) return `${esc(cur.name)} is thinking…`;
  if (ui.online && s.current !== net.mySeat) return net.mySeat < 0 ? `Watching ${esc(cur.name)}…` : `${esc(cur.name)} is playing…`;
  if (s.phase === 'start') {
    return E.handSize(s, s.current) === 0 ? 'All your dice are on cards — take them back to roll' : `${esc(cur.name)}: roll your ${E.handSize(s, s.current)} dice`;
  }
  if (!s.rolled.length) return 'All dice placed';
  if (!E.legalMoves(s).length) return 'No matches this time';
  return ui.selected === null ? 'Tap a die, then the card it fits' : 'Tap a highlighted card';
}

function cardView(s, card, ci) {
  const accepts = ui.selected !== null && E.canPlace(s, ui.selected, ci);
  const used = new Map(); // per player, how many of each face already counted
  const slots = card.need.map((face) => {
    const owners = s.players.map((_, p) => p).filter((p) => {
      const key = `${p}:${face}`;
      const n = used.get(key) || 0;
      const has = card.placed[p].filter((f) => f === face).length;
      used.set(key, n + 1);
      return has > n;
    });
    const mine = owners.includes(s.current);
    const others = owners.filter((p) => p !== s.current);
    const dots = others.map((p) => `<i style="--c:${color(p)}"></i>`).join('');
    return `<div class="slot ${mine ? 'mine' : ''}">
      ${die(face, mine ? 'mine' : 'ghost', mine ? `style="--c:${color(s.current)}"` : '')}
      <span class="dots">${dots}</span></div>`;
  }).join('');
  return `<div class="gcard ${accepts ? 'accepts' : ''}" data-act="pickCard" data-card="${ci}" role="group">
    <div class="pts">${card.points}<small>PTS</small></div><div class="slots">${slots}</div></div>`;
}

function gameView() {
  const s = ui.game;
  const human = isMine(s);
  const chips = s.players.map((p, i) => `
    <div class="chip ${i === s.current && s.phase !== 'over' ? 'active' : ''}" style="--c:${color(i)}">
      <span class="n">${esc(p.name)}${ui.online && i === net.mySeat ? ' (you)' : ''}</span><span class="s">${p.score}<small> / ${E.TARGET_SCORE}</small></span>
    </div>`).join('');

  let tray;
  if (s.phase === 'placing') {
    tray = s.rolled.map((f, i) => die(f, `${ui.rolling ? 'rolling' : ''} ${ui.selected === i ? 'sel' : ''}`,
      human && !ui.rolling ? `data-act="pickRolled" data-i="${i}"` : 'disabled', 'button')).join('')
      || '<span class="hint">—</span>';
  } else {
    const n = E.handSize(s, s.current);
    tray = n ? Array.from({ length: n }, () => die(1, 'ghost')).join('').replace(/aria-label="1"/g, 'aria-label="die in hand"') : '<span class="hint">No dice in hand</span>';
  }
  const onCards = E.DICE_PER_PLAYER - E.handSize(s, s.current);
  const canTakeBack = human && s.phase === 'start' && onCards > 0;
  const mustTakeBack = canTakeBack && onCards === E.DICE_PER_PLAYER;
  const canRoll = human && s.phase === 'start' && E.handSize(s, s.current) > 0;
  const canEnd = human && s.phase === 'placing' && !ui.rolling;
  const noMoves = canEnd && !E.legalMoves(s).length;

  return `
    <div class="game">
    <div class="table">
    <div class="score" style="--per:${Math.ceil(s.players.length / Math.ceil(s.players.length / 4))}">${chips}</div>
    <div class="status">${statusText(s)}</div>
    <div class="cards">${s.cards.map((c, i) => cardView(s, c, i)).join('')}</div>
    </div>
    <div class="tray">
      <div class="dice">${tray}</div>
      <div class="actions">
        <button class="btn primary ${canRoll ? 'pulse' : ''}" data-act="roll" ${canRoll ? '' : 'disabled'}>Roll</button>
        ${s.phase === 'start' ? `<button class="btn ${mustTakeBack ? 'primary pulse' : ''}" data-act="takeBack" ${canTakeBack ? '' : 'disabled'}>Take back &amp; roll all</button>` : `<button class="btn ${noMoves ? 'primary pulse' : ''}" data-act="end" ${canEnd ? '' : 'disabled'}>End turn</button>`}
        <button class="btn" data-act="menu" style="flex:0 0 auto" aria-label="Menu">☰</button>
      </div>
    </div>
    </div>`;
}

      <button class="btn" data-act="rules">How to play</button>

      ${ui.online ? '' : '<button class="btn" data-act="rematch">Restart game</button>'}
      <button class="btn" data-act="toSetup">${ui.online ? 'Leave room' : 'Main menu'}</button>
      <button class="btn primary" data-act="closeModal">Resume</button></div></div>`;

/* ---------- flow ---------- */

function say(text, ms = 1800) {
  ui.toast = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast = ''; render(); }, ms);
}

const isMine = (s) => s.phase !== 'over' && (ui.online ? s.current === net.mySeat : !s.players[s.current].cpu);
const canAct = () => !!ui.game && !ui.rolling && isMine(ui.game);
let rollTimer = 0;

/** Apply a game state, whether it came from this device or the network. */
function receive(next) {
  const prev = ui.game;
  if (prev && prev.gid === next.gid && next.rev <= prev.rev) return; // duplicate or stale
  ui.game = next;
  ui.selected = null;
  if (next.lastClaim && prev?.rev !== next.rev) {
    const c = next.lastClaim;
    say(`${next.players[c.player].name} claimed ${c.points} points!`);
  }
  if (prev && prev.gid === next.gid && prev.phase === 'start' && next.phase === 'placing') {
    ui.rolling = true;
    clearTimeout(rollTimer);
    rollTimer = setTimeout(() => { ui.rolling = false; render(); settle(); }, ROLL_MS);
  }
  render();
  settle();
}

/** A move made on this device: show it now and, online, share it. */
function commit(next) {
  next.rev = (ui.game?.rev ?? 0) + 1;
  next.gid = ui.game?.gid;
  receive(next);
  if (ui.online) pushRoom({ ...net.room, game: next, status: next.phase === 'over' ? 'over' : 'playing' });
}

function pushRoom(data) {
  net.room = data;
  net.q = net.q.then(() => net.ref.set(data)).catch(() => say('Could not sync. Check your connection.'));
  return net.q;
}

function settle() {
  clearTimeout(timer);
  const s = ui.game;
  if (!s || s.phase === 'over' || ui.rolling) return;
  if (s.players[s.current].cpu) {
    if (!ui.online || isHost()) timer = setTimeout(cpuStep, CPU_DELAY);
  } else if (isMine(s) && s.phase === 'placing' && (!s.rolled.length || !E.legalMoves(s).length)) {
    if (s.rolled.length) say('No matching cards — turn passes');
    timer = setTimeout(() => { if (ui.game === s) commit(E.endTurn(s)); }, 1300);
  }
}

function doRoll() { commit(E.roll(ui.game)); }
function doTakeBack() { commit(E.roll(E.takeBack(ui.game))); }

function cpuStep() {
  const s = ui.game;
  if (!s || s.phase === 'over' || !s.players[s.current].cpu) return;
  const a = aiNextAction(s);
  if (a.type === 'takeback') commit(E.takeBack(s));
  else if (a.type === 'roll') doRoll();
  else if (a.type === 'place') commit(E.place(s, a.rolled, a.card));
  else commit(E.endTurn(s));
}

function freshGame(configs) {
  const g = E.newGame(configs);
  g.rev = 0;
  g.gid = Math.random().toString(36).slice(2);
  return g;
}

function startGame() {
  clearTimeout(timer);
  ui.online = false;
  ui.game = null;
  const g = freshGame(ui.setup);
  ui.screen = 'game';
  ui.rolling = false;
  ui.modal = null;
  receive(g);
  say(`${g.players[g.current].name} goes first (rolled ${g.firstRoll})`, 2500);
}

/* ---------- online rooms ---------- */

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');

function savedSession() {
  try { return JSON.parse(localStorage.getItem('rfi-session')); } catch { return null; }
}
const saveSession = (code, host) => store.set('rfi-session', JSON.stringify({ code, host }));

function localUid() {
  let id = store.get('rfi-uid');
  if (!id) { id = `p_${Math.random().toString(36).slice(2)}${Date.now().toString(36)}`; store.set('rfi-uid', id); }
  return id;
}

async function initNet() {
  try {
    if (window.claude?.use) {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid) { net.store = dbStore(db); net.uid = uid; }
    } else if (window.Peer) {
      net.uid = localUid();
      net.store = p2pStore(window.Peer, window.RFI_PEER_OPTIONS, net.uid);
    }
  } catch { /* online play unavailable */ }
  const m = /^#([A-Za-z]{4})$/.exec(location.hash);
  if (net.store && m && ui.screen === 'setup') { ui.joinCode = m[1].toUpperCase(); ui.screen = 'online'; }
  render();
}

function attach(ref) {
  net.unsub?.();
  net.ref?.close?.();
  net.ref = ref;
  net.room = null;
  net.q = Promise.resolve();
  net.unsub = ref.onSnapshot(onRoom, () => { say('Lost connection to the room'); leaveRoom(); });
}

function onRoom(snap) {
  if (!snap.exists) { if (ui.online) { say('Room closed'); leaveRoom(); } return; }
  const room = snap.data();
  net.room = room;
  net.mySeat = room.seats.findIndex((p) => p.uid === net.uid);
  ui.online = true;
  if (room.status === 'lobby') {
    clearTimeout(timer);
    ui.game = null;
    ui.screen = 'lobby';
    ui.modal = null;
    render();
  } else {
    ui.screen = 'game';
    receive(room.game);
  }
}

function leaveRoom() {
  clearTimeout(timer);
  net.unsub?.();
  net.unsub = null;
  net.ref?.close?.();
  net.ref = null;
  store.set('rfi-session', '');
  net.room = null;
  net.mySeat = -1;
  ui.online = false;
  ui.game = null;
  ui.rolling = false;
  ui.modal = null;
  ui.screen = 'setup';
  render();
}

/** Read-modify-write on the room, serialised across players with a short lease. */
async function mutateRoom(fn) {
  for (let i = 0; i < 8; i++) {
    const lease = await net.ref.acquire({ holder: net.uid, ttlMs: 1000 });
    if (lease.acquired) {
      const snap = await net.ref.get();
      if (!snap.exists) return;
      const next = fn(structuredClone(snap.data()));
      if (next) await pushRoom(next);
      return;
    }
    await sleep(300 + Math.random() * 300);
  }
  say('The room is busy. Try again.');
}

const myName = () => (ui.name.trim() || 'Player').slice(0, 12);

const failText = (e) => (e.message === 'notfound' ? 'No room with that code' : e.message === 'network' ? 'Could not reach the network. Check your connection.' : 'Could not connect. Try again.');

async function createRoom() {
  net.busy = true; render();
  try {
    let ref;
    let code;
    for (let i = 0; i < 6 && !ref; i++) {
      code = newCode();
      try { ref = await net.store.host(code); } catch (e) { if (e.message !== 'taken') throw e; }
    }
    if (!ref) throw new Error('taken');
    attach(ref);
    saveSession(code, true);
    await pushRoom({ code, hostUid: net.uid, status: 'lobby', seats: [{ uid: net.uid, name: myName(), cpu: false }], game: null, createdAt: Date.now() });
  } catch (e) { leaveRoom(); ui.screen = 'online'; say(net.store.kind === 'db' ? 'Could not create a room. The page needs to be shared with you as an editor.' : failText(e)); }
  net.busy = false; render();
}

async function enterRoom(code, { host = false } = {}) {
  const ref = host ? await net.store.host(code, { resume: true }) : await net.store.join(code);
  attach(ref);
  if (!host) {
    await mutateRoom((room) => {
      if (room.seats.some((p) => p.uid === net.uid)) return null; // rejoining
      if (room.status !== 'lobby' || room.seats.length >= MAX_PLAYERS) return null; // watch only
      room.seats.push({ uid: net.uid, name: myName(), cpu: false });
      return room;
    });
  }
  saveSession(code, host);
}

async function joinRoom() {
  const code = ui.joinCode.trim().toUpperCase();
  if (code.length !== 4) { say('Enter the 4-letter room code'); return; }
  net.busy = true; render();
  try { await enterRoom(code); } catch (e) { leaveRoom(); ui.screen = 'online'; say(net.store.kind === 'db' ? 'Could not join. The page needs to be shared with you as an editor.' : failText(e)); }
  net.busy = false; render();
}

async function resumeRoom() {
  const s = savedSession();
  if (!s) return;
  net.busy = true; render();
  try { await enterRoom(s.code, { host: s.host }); } catch (e) { leaveRoom(); say(failText(e)); }
  net.busy = false; render();
}

async function invite() {
  const code = net.room?.code;
  const url = `${location.origin}${location.pathname}#${code}`;
  const text = `Join my Roll for It game: room ${code}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Roll for It', text, url }); return; }
    await navigator.clipboard.writeText(`${text}\n${url}`);
    say('Invite copied');
  } catch { say(`Tell friends room code ${code}`); }
}

async function startOnline() {
  await mutateRoom((room) => {
    if (room.hostUid !== net.uid || room.seats.length < 2) return null;
    room.game = freshGame(room.seats);
    room.status = 'playing';
    return room;
  });
}

const actions = {
  toggleCpu: ({ i }) => { ui.setup[i].cpu = !ui.setup[i].cpu; render(); },
  addPlayer: () => { ui.setup.push({ name: `Player ${ui.setup.length + 1}`, cpu: true }); render(); },
  removePlayer: ({ i }) => { ui.setup.splice(i, 1); render(); },
  start: startGame,
  rematch: () => (ui.online ? startOnline() : startGame()),
  goOnline: () => { ui.screen = 'online'; render(); },
  createRoom,
  joinRoom,
  resume: resumeRoom,
  invite,
  startOnline,
  addSeatCpu: () => mutateRoom((room) => {
    if (room.hostUid !== net.uid || room.seats.length >= MAX_PLAYERS) return null;
    const n = room.seats.filter((p) => p.cpu).length + 1;
    room.seats.push({ uid: null, name: `Robo ${n}`, cpu: true });
    return room;
  }),
  removeSeat: ({ i }) => mutateRoom((room) => {
    if (room.hostUid !== net.uid || !room.seats[i]?.cpu) return null;
    room.seats.splice(i, 1);
    return room;
  }),
  skipTurn: () => {
    const g = structuredClone(ui.game);
    g.rolled = [];
    g.phase = 'start';
    g.current = (g.current + 1) % g.players.length;
    ui.modal = null;
    commit(g);
  },
  toSetup: () => { if (ui.online || net.unsub) { leaveRoom(); return; } clearTimeout(timer); ui.screen = 'setup'; ui.modal = null; ui.game = null; ui.rolling = false; render(); },
  rules: () => { ui.modal = 'rules'; render(); },
  menu: () => { ui.modal = 'menu'; render(); },
  closeModal: () => { ui.modal = null; render(); },
  roll: () => { if (canAct() && ui.game.phase === 'start' && E.handSize(ui.game, ui.game.current) > 0) doRoll(); },
  end: () => { if (canAct() && ui.game.phase === 'placing') { clearTimeout(timer); commit(E.endTurn(ui.game)); } },
  takeBack: () => { if (canAct() && ui.game.phase === 'start') doTakeBack(); },
  pickRolled: ({ i }) => {
    if (!canAct() || ui.game.phase !== 'placing') return;
    const idx = +i;
    const targets = ui.game.cards.map((_, c) => c).filter((c) => E.canPlace(ui.game, idx, c));
    if (!targets.length) { say('No card needs that number'); return; }
    if (targets.length === 1) { commit(E.place(ui.game, idx, targets[0])); return; }
    ui.selected = ui.selected === idx ? null : idx;
    render();
  },
  pickCard: ({ card }) => {
    if (canAct() && ui.selected !== null && E.canPlace(ui.game, ui.selected, +card)) commit(E.place(ui.game, ui.selected, +card));
  },
};

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || (el.classList.contains('modal') && e.target !== el)) return;
  // Slots sit inside cards; the slot's own action wins over the card's.
  actions[el.dataset.act]?.({ ...el.dataset });
});
app.addEventListener('input', (e) => {
  if (e.target.id === 'myname') { ui.name = e.target.value; store.set('rfi-name', ui.name); return; }
  if (e.target.id === 'joincode') { ui.joinCode = e.target.value.toUpperCase(); return; }
  const i = e.target.dataset?.name;
  if (i !== undefined) ui.setup[i].name = e.target.value.trim() || `Player ${+i + 1}`;
});

render();
initNet();


</script>
